---
冒险者公会:
  势力标识: 交叉的剑与盾牌
  总部: 瓦伦蒂亚公国·诺瓦·瓦伦蒂亚城 (设有最高委员会、跨区域调度中心、中央档案库)

  核心职能:
    任务撮合: 魔物清剿、遗迹探索、灾害响应
    行业认证: 等级评定、战技培训
    资源支持: 情报共享、医疗救援
    职业培养: 为新人引荐高等冒险者作为导师，传授技能

  组织架构:
    最高委员会: 总部常设机构，由高阶冒险者代表与资深管理者组成，为各分公会制定规则
    分支体系: 总部—城市分部—城镇分部，覆盖大陆主干商路与边境要塞，城镇分部兼管周边村庄
    独立合作: 各地区公会互不隶属但相互协作，分会长由当地名望最高的冒险者担任
    最小单位: 
      设施: 公会大厅+酒馆+公开资料室+训练场
      人员: 会长(负责管理、接待、战技培训，一人全套)
    标准单位: 
      设施: 最小单位+接待室+办公室+成员宿舍
      人员: 会长+接待者+顾问+战技导师(包含进攻、防御、远程、情报等方向的多位导师)
    高级单位: 拥有更完善的设施与人员配置

  经济与福利:
    委托金: 委托金80%为冒险者奖励(任务板的奖励已扣除抽成，不显示原价和抽成)
    抽成构成: 公会运营10%，保险基金10%(与圣灵教会共管)
    福利保障:
      医疗救援: 任务负伤由圣灵教会提供神术治疗，费用由保险基金支付
      保险基金: 向冒险者保密的个人基金，未动用则累积，专供本人医疗与抚恤

  阶级体系:
    D/C: 基础任务与公共后勤支持 (D级入会费100Z)
    B: 中级任务、装备维护折扣、紧急医疗优先
    A: 高危任务资格、专属情报订阅、跨城优先调度
    S: 最高权限委托、战略级支援
    晋升条件: 完成2个自身同级任务，并接取公会指派的晋升任务 (上级难度、无奖励、仅晋级)

  对外关系:
    政治定位: 跨国界中立组织，契约独立，与各国政府合作应对魔物威胁，但拒绝接受单一国家的行政管辖
    伯伦斯法环: S/A级冒险者可接取魔法专项高危委托
    魔法协会: 推荐法师前往进修，享入学折扣
    圣灵教会: 提供医疗支持
    金狮商会: 共享部分商业情报与物流渠道
    锻造/炼金公会: 享有装备维护与药剂采购的协议价

  特色文化:
    纪念英勇周: 年度盛典，表彰年度榜单上的杰出冒险者
    徽章授予礼: 晋升仪式，由评定官授勋并更新档案
    风险信条: 鼓励全副武装的谨慎，推行强制性的任务前简报制度