---
魔法协会:
  势力标识: 咒印之臂(古代传奇魔法象征)
  总部: 奥古斯提姆帝国—时钟塔城
  核心宗旨: 普及魔法知识，启蒙智慧之火，培育魔法人才"到达根源"
  核心目标:
    公开:
      建立标准魔法教育体系，认证法师资格
      为各国与地方输送法师人才
      与金狮商会合作管理魔法专利
    维护标准: 确保教育质量，推动魔法平民化
  组织架构:
    最高领导: 指导委员会
    分支体系: 覆盖人类城镇与乡村，地区魔法塔、学校即地区协会
  阶级体系:
    源神/现人神(神话): 持有根源之一，当前无人达到
    大君/王爵(传说): 融汇多重领域，对魔法本源有深刻理解
    理阶法师(史诗): 特定领域内公认的权威，开创过分支理论或独有魔法
    上阶法师(稀有): 在特定领域取得独创性成果，拥有指导学徒的资格
    正阶法师(优良): 掌握优良-稀有级魔法，可任教或开办书店
    下阶法师(普通): 学习基础理论，通过考核可晋升
    备注: 社会称号通常为${家系/专业/领域/方向}${阶级名}
  核心职能:
    教育与认证:
      普通至稀有级课程理论、实践、应用
      在中小城镇建设魔法塔、学校与书店
    地方服务:
      为商会提供魔法灯、恒温符石等基础魔法产品
      开设地方学科(农、林、矿等产业)
    合作深造:
      与伯伦斯法环共建雾晶学院，推荐优秀学徒进修
    知识传播:
      设基础魔法研究部，开发教材与日常魔法应用产品
  对外关系:
    各国皇室/领主: 紧密合作；以教育换取土地与资金支持
    伯伦斯法环: 核心合作伙伴；在人才与魔法理论上深度合作
    冒险者公会: 辅助关系；提供魔法道具，协同处理魔法事件
    金狮商会: 商业盟友；资助学校建设，协助管理专利
    炼金/锻造公会: 学术交叉；在附魔与材料学上合作
    梵尼亚: 长期冷战，理念冲突
    非法组织: 严格规避公开联系，但秘密接触
特色仪式:
  入学检测: 检测第一层级智力(INT)潜力 C≥4, B≥6, A≥7, S≥8; C以下无培养潜力，A优秀，S保送深造
  资格授予: 通过考核授予证书与法杖，可开办书店
  毕业推荐: 优秀学生获推荐信，可前往伯伦斯法环或时钟塔深造
文化风貌:
  魔法惠民: 魔法应惠及众生，但需循序渐进
  实践导向: 强调魔法在生活中的应用，鼓励解决实际问题
  合作精神: 重视与地方势力的互动，视教育为共同事业