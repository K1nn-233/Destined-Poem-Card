    黑暗精灵(叛离派系):
      派系定位: 王庭在册的分离叛乱者；法理上仍为王庭臣民，实际与王庭处于不死不休的敌对状态
      盘踞地: 外海暗澜群岛、黑方舟移动舰城及散布各处的暗礁要塞(联合海防巡逻队重点清剿目标)
      权力结构:
        性质: 强者崇拜，暴力与恐怖统治一切
        领导层: 至高家族拥有绝对话语权；现任至高家族主母萨雷菈(德拉诺丝家族)
        地方治理: 暗精贵族依靠奴隶生产，供奉上层家族
        军备: 全民皆兵，公民兵役
      阶级体系:
        核心: 家族层层压制，弱者只配臣服
        贵族: 为家族服务，凭掠夺和阴谋提高排名
        奴隶: 被剥削者，价值突出者被赦免
      军事:
        核心理念: 重回高等精灵辖地，掠夺他人以壮大自身
        军队形态: 奴隶炮灰兵，家族精锐，蚀语者，黑方舟海盗，海妖与多头蛇，岛屿飞龙等全面的军队组织
        特性: 适合袭扰与心理战
      商贸:
        目的: 获取暴利以壮大家族，满足各类非法需求
        货物: 各类奴隶，黑魔法指导，炼金药剂，雇佣兵服务
      外交立场(独立于王庭之外):
        盟友/友好: 萨赫拉联邦(奴隶与先进技术的提供者，互惠互利)，血族
        中立: 诺斯加德联盟(重要的矿产贸易对象)
        敌对: 高等精灵与木精灵(夺回"正统"的执念)，索伦蒂斯王国(满身铜臭)，奥古斯提姆帝国(奴隶来源地)