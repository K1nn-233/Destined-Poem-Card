  地理:
    宏观地貌: 全境呈不规则五边形，整体为一块向南突出、三面临海的半岛型陆域
      西侧隔狭长海域与克摩什大陆相望，南侧与东南侧直接临海，并散布少量近岸岛屿
      北部地势较为开放，与天镜湖湿地相邻；北东方向接壤烁露林间
      境内总体呈“外围山地—中部平原—南部海岸”的地貌结构
    气候梯度: 北部凉湿—中部温和—南部海洋性增强
    版图构成:
      北部边境带: 以疏林、湿润草地和零散丘陵为主，是天镜湖湿地向内陆环境过渡的缓冲区
      东部山林区: 山岭、林地密集，地形相对闭塞，与烁露林间之间不存在极强的天然隔断
      中央平原区: 境内面积最大的连续开阔地，木呈斑块状散布，是人口、道路与农业最容易集中的区域
      西部海峡: 沿西侧狭长海域东岸展开，以低山、丘陵和成片疏林为主，地势由中央平原向海岸逐渐收紧；隔海与克摩什大陆相望，是内陆通往西部海峡的重要过渡地带
      东南山海区: 由境内最高或最陡峭的一组山体与南部海岸共同构成，山海距离很短，平地有限
      南部沿海带: 海岸线曲折，存在半岛、岬角、小型海湾和近岸岛屿，适宜形成港口、渔业聚落或海防据点
      暗澜群岛: 远悬于半岛东南外海的破碎火山群岛，黑曜石质岛体、环礁链与暗礁要塞沿深海沟边缘散布
    地块邻接索引:
      北部边境带: 北&西北-天镜湖湿地; 东-东部山林区; 南-中央平原区; 西南-西部海峡
      东部山林区: 东-烁露林间; 西-北部边境带; 西南-中央平原区; 南-东南山海区
      中央平原区: 北-北部边境带; 东北-东部山林区; 东南-东南山海区; 南-南部沿海带; 西-西部海峡
      西部海峡: 北-北部边境带; 东-中央平原区; 南-南部沿海带; 西-西侧狭长海域，对岸为克摩什大陆
      东南山海区: 北-东部山林区; 西&西北-中央平原区; 西南-南部沿海带; 东&东南-近岸海域及外海
      南部沿海带: 西北-西部海峡; 北-中央平原区; 东北&东-东南山海区; 南&东南-外海; 沿岸-少量近岸岛屿
      暗澜群岛: 西北-隔海遥望南部沿海带; 北-隔海域遥望东南山海区; 东&南-无尽海
    城镇归属:
      北部边境带: 曙光瞭望
      东部山林区: 艾尔文海姆，眠根谷
      中央平原区: 卢泰西亚
      西部海峡: 星冕港
      东南山海区: 星辰岸
      南部沿海带: 白焰港
      暗澜群岛: 沉月城，黑方舟(位于附近海域)
