眠根谷:
  概览:
    定位: 万木之源的绝对守护地，世界树在阿斯塔利亚的物理锚点，远古自然力量与生命律交织的休眠乡
    选址: 坐落于大陆西南，世界树根部尽头之地。峡谷的峭壁并非岩石，而是世界树盘土而出、粗壮如连绵山脉的巨型主根
    规模: 远古生态区级 | 纵横与太精灵的栖息息息
    人口构成: 远古树精 | 木精灵 | 自然之灵
    城市意象: 山谷常年笼罩在厚重且静谧的淡绿色晨雾中。没有人工开凿的死板道路，只有顺应树根纹理生长的发光苔藓指引方向，呈现出一种缓慢、原始且充满生命脉动的自然巨物之美。作为交通工具的驼鼻，在高处筑巢，带领精灵们飞翔
  城市结构:
    苍根穹顶:
      性质: 世界树之根与云根网络在半空交错形成的天然屏障，高阶观星者、鹰隼与风之灵的栖息地
      边界: 由木精灵们细心梳理的平台，是通往世界树顶端的渠道
      地势: 悬浮于半空的宏大根须网络，终年弥漫着清苔香与高浓度魔力，是世界树的呼吸之地
      生态: 长者们与木精灵之友的会客地，年轻的木精灵也偶尔会结伴前来，与世界树共呼吸
    巨像之肩:
      性质: 木精灵平民的日常生活区、商业区与自然共鸣之地，同时也是远古树精休眠时的物理躯干
      边界: 镶嵌于参天巨木与沉睡树精构成的肩膀之间
      风貌: 精灵们不进行任何破坏性建造，而是引导藤蔓与枝干自然交织。空气中回荡着树木缓慢拔节的细微声响与大地的深沉呼吸
      生态: 纯粹的自然物交换点
    源血林床:
      性质: 庞大生命力的沉淀池与远古自然魔力的起源漩涡
      边界: 向地脉深处无限延伸，直接与世界树的根须末端相连。没有人工防线，只有与大地同化的远古树精在沉睡中守护着这片静谧领地
      地貌: 被厚实如绿色天鹅绒般的远古苔藓覆盖。谷底流淌着世界树根系渗出的翡翠色“翠痕源血”，滋养着最原始的林地生态，乃至整片木精灵的领域
  特殊地点:
    咏灵心池: 一大汪由生命源血汇聚而成的清澈泉水，周围环绕着散发微光的古老魔晶。受伤的生灵与疲惫的旅人在此得到世界树最纯粹的治愈与灵魂洗涤
    咏木共振场: 远古树精偶尔苏醒时，舒展躯体引发大地轰鸣的自然旷野。木精灵们在此聆听大地的脉搏，举行盛大的“咏木之歌”以安抚巨像
    万息共生园: 终日弥漫着高浓度纯净魔力的植物培育中心；木精灵长者们在此静心梳理灵脉流向，引导古老濒危的魔法植物重新扎根，孕育出蕴含生命法则的自然珍宝
    树根编织庭: 依托世界树根系树根建立的自然工艺枢纽。木精灵们怀着敬畏之心，用歌声引导脱落的奇珍木种与坚韧藤蔓，让其自然生长并拼接成护林的巨型树人护卫
  任务层级: S级（世界树源头）
  生命层级: 5（远古树精&世界树之灵&木精灵长老&咏木者）/4（木精灵巡林客&共生自然灵）