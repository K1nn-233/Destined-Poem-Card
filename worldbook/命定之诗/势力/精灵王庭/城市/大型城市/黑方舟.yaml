舰城-黑方舟:
  概览:
    定位: 至高家族的庞大黑方舟，拥有其它方舟望尘莫及的规模与生产能力
    位置: 无尽海中东部
    规模: 首都级 | 最大黑方舟
    人口: 各族奴隶65% | 暗精25% | 其他10%
    舰城意象: |
      黑曜石与深海巨兽骨甲拼合的舟体如一柄插入洋流的巨斧，劈开的不是波涛而是光线本身
      方舟行经之处海面呈现病态的墨紫色，仿佛洋流被抽去了温度与生机
      夜冕宫的倒金字塔悬于最高处，在蚀光结界折射下如一枚永远不落的黑月
      唯有沉星市的灯火从舷窗与栈桥缝隙间泄出，像一道被缝合的伤口渗出的脓光，提醒注视者这座移动的深渊并非死物
      它在呼吸，在进食，在永不停歇地漂向下一场掠夺
  舰城结构:
    黑脊: 贯穿整座黑方舟的结构与魔力中轴，既是巨型龙骨，也是全舰术法网络与动力系统的依附核心

    夜冕之巅(上层):
      性质: 至高家族的绝对领地，舰城最高权力、异神祭祀与战略决策中枢
      位置: 舰城最高层甲板、中央塔群与黑脊顶部，凌驾于大部分防御设施和城市建筑之上
      核心建筑:
        夜冕宫: 方舟最高处的纯黑曜石倒金字塔，黑魔法可以瞄准方舟上的任何一人
        苍白隙: 直接沟通异神的裂隙，蚀界力量在舰城核心的汇聚点

    蚀月之腰(中层):
      性质: 贵族政治、军事教育、魔法研究与高级工坊集中区，维持黑方舟统治体系的实际中枢
      位置: 环绕黑脊展开的大型上层舱区、塔楼与悬空栈桥群
      核心区域:
        渊流院: 负责高等军事与魔法教育，建筑结构如深渊延伸，代表阶级
        幻月庭: 顶部为弯月状水晶以收集月光，高阶学者在这里研究
        冷焰枢: 深海地脉的幽冷蓝焰在此处，如同冰水一样重塑形态
        家族领地舱区: 次席家族在方舟上的指定居住与经营区域

    沉星之环(中层):
      性质: 黑方舟最繁华也最混乱的公共区域，承担贸易、娱乐、雇佣、情报与外来人口管理
      位置: 舰体中央最宽阔的横向甲板与开放舱区，连接主要外舷码头和货运升降井
      核心建筑:
        沉星市: 方舟上最繁华的交易枢纽
        黑舷栈桥: 黑方舟与外部世界连接最频繁的区域
        百刃场: 竞技、决斗与公开处刑场
        锁契馆: 契约、债务、奴籍与大宗贸易登记之所

    无声之渊(下层):
      性质: 奴隶居住、筛选、驯化与消耗区域，也是整座黑方舟最庞大的底层人口区
      位置: 舰腹深层，由数十层低矮舱室、矿仓改造区、锁链通道与废弃结构组成
      概况: 数十万的奴隶所居住的庞大下层船舱，结界之下绝对寂静
  资源:
    采集:
      - 传说_材料&奴隶(碎星市&无声层)
    制造:
      - 传说_装备(冷焰枢)
      - 传说_药剂(渊流院)
    交易:
      - 传说_物品(幻月庭)
    教育:
      - 传说_炼金术(渊流院)
      - 神话_魔法/高等军事教育(渊流院)
      - 传说_锻造(冷焰枢)
  任务层级: S级（最高）
  生命层级: 5(至高主母&首席战士)/5(其它家族主母&首席战士)/4(外来者&家族超凡者)