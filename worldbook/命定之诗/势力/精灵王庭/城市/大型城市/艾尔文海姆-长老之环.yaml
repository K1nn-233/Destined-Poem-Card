  长老之环:
    银冠厅:
      定位: 精灵长老议会正厅。由数十株巨枝天然交织成的无顶穹厅，仰可见世界树冠与星空
      功能: 长老议会集议、圣域事务裁决、行使圣域否决权、迎迓王庭使节
      领导: 现任首席长老奥兰迪尔于此主事；代表圣域列席卢泰西亚王庭时由此启程
    新月坛:
      定位: 世界树信仰最高祭坛，露天，形如新月
      功能: 育木祭、归根礼
    忆藤书库:
      定位: 圣域历史档案馆，藤蔓与活木交织成的半封闭空间
      功能: 圣域传统、育林秘法、盟约与谱系的活态保存
    青帐使庭:
      定位: 接待高精使团、龙誓骑团联络官之所