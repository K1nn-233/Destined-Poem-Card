  外环-羽环:
    总述: 七条辐射主街将外环切分为七区
    晨星区(北):
      性质: 陆路商贸区，面向北部边境带与天镜湖湿地方向
      要点: 北门"曙光门"为陆上商队主入口；木精灵草药与药水的最大集散市"青露市"设于此；兽族联盟商队指定歇脚区
    炬星区(东北):
      性质: 工坊区
      要点: 民间武具与炼金品工坊聚集，星辉学宫的学徒常在此接私活
    澜星区(东):
      性质: 漕运码头区
      要点: 双辉河码头，东部山林区的巨木、山货由水路抵京
    穗星区(东南):
      性质: 农市与仓储区
      要点: 中央平原谷物果品汇集地，王庭常平仓所在；战时后勤总库
    帆星区(南):
      性质: 南路商埠区
      要点: 通往南部沿海带与白焰港的官道起点；银帆同盟驻京会馆"银帆邸"在此
    锋星区(西南):
      性质: 军务区
      要点: 正规军京畿大营、公民戍军操演场、征募司；城外三里即龙誓骑团誓约校场，晴日可见巨龙起落，本区房价因此最低、酒馆生意因此最好
    弦星区(西):
      性质: 学艺与雅居区
      要点: 精灵艺术品工坊、乐坊、剧场聚集；通往西部海峡与星冕港的官道起点；退休廷臣与老学者聚居，是全城流言与政见的酝酿池。改革派的檄文、鹰派的悲歌，在同一间乐坊里流通
    生垣与七门:
      生垣: 外环边缘的活体育林城墙，高逾十丈，平时枝叶疏朗如林荫、设税关与哨塔
      七门: 曙光门(北)、炬火门(东北)、澜川门(东)、金穗门(东南)、扬帆门(南)、砺锋门(西南)、流弦门(西)