世界树之城-艾尔文海姆:
  概览:
    定位: 木精灵世界树圣域的政治与经济双中心，世界树信仰的本源圣地，东部山林区林海腹地
    选址: 东部山林区腹地，世界树高踞的中央谷地与环抱山脊之间，依巨木、山岩与地下水脉而生
    规模: 大型城市
    人口: 木精灵 | 远古树精 | 自然之灵 | 其他
    城市意象: |
      远望不见城，只见一株高耸入云、冠盖蔽野的世界树，其下林海苍茫；
      入林后方觉万木之间灯火隐现，树居悬于枝头，木桥织于林冠，根穴透出微光，
      夜间世界树叶脉泛起淡淡银辉，如新月倾泻，被称为树辉之夜
  任务层级: S级（世界树圣域）
  城市结构:
    世界树: 主干需数万人合抱，逸散的自然魔力使全城草木常青、伤者易愈；顶冠据说可触及星辰
    第一环-根心圣域(树心):
      性质: 全城最神圣不可侵之地，非德鲁伊/长老不得入
      地理: 世界树主干基部与外露主根群，根隙间为天然圣泉
      核心建筑: 低语根隙，世界树主干
    第二环-长老之环(内环):
      性质: 圣域治理与信仰中枢
      地理: 世界树最粗壮的一圈支根与低层巨枝之上/之内
      核心建筑: 银冠厅，新月坛，忆藤书库，青帐使庭
    第三环-育木之环(中环):
      性质: 德鲁伊修行、育林、炼药与教育区(世界树学环所在)
      地理: 中层枝干与谷地缓坡
      核心建筑: 世界树学环，巡林客营地，鹰隼塔巢，炼药露台
    第四环-栖居之环(外环):
      性质: 木精灵日常聚居生活区
      地理: 谷地林间与外围坡地，居所依巨木散布
      核心建筑: 树屋，愈林苑，诸兽栖谷，露泉集
    第五环-林缘之环(边环):
      性质: 圣城与外部世界的唯一实质接口，树荫渐疏、魔力渐薄处
      地理: 谷城边缘，树荫渐疏处，接东部山林区古道网
      门户:
        烁露林口方向: 通东部山林区/烁露林间，兽族联盟商队与草药贸易主道
        北向古道: 经北部边境带门户，接天镜湖湿地与北方旅人
        西南古道: 经中央平原区通往卢泰西亚