  内环-冠环:
    凤凰王宫廷(西宫):
      别称: 金羽之殿
      形制: 白石与鎏金构造，正殿"焰冠厅"穹顶饰展翼金凤
      核心建筑:
        焰冠厅: 凤凰王理政与接见外使之所
        凤羽议厅: 凤羽廷臣团驻地，政令起草与颁行的实际中枢，日夜灯火不熄
        选贤堂: 凤凰王选举的法定场所，平日封闭，唯选举年开启
      驻守: 宫廷卫队西翼"金羽卫"
    永恒女王宫廷(东宫):
      别称: 星辉之殿
      形制: 银白石与活树共生构造，正殿"恒星厅"无穹顶，以魔法维持殿内四季无雨、夜观繁星
      核心建筑:
        恒星厅: 永恒女王理政与主持祭仪之所
        谱牒塔: 恒星內侍院驻地，藏历代王室谱系与继承法理裁定文书，塔内禁火，以星辉石照明
        观星回廊: 天穹观星院分坛，预言解读由此呈报女王
      驻守: 宫廷卫队东翼"银辉卫"
    星心广场(双宫之间):
      定位: 全城几何与政治的双重中心
      核心建筑:
        - 广场中央立有一株由世界树枝条培育的银叶树，与一根金凤浮雕石柱相互缠绕生长
        - 艺术宫: 王庭历代珍藏的奥术造物、星辉画作与战争纪念品的永久陈列殿，向全体精灵公民开放，被誉为千年记忆的白石长廊；东廊陈列古精灵时期的古典巨作，西廊是复兴纪元以来的淡色系新作，恰似一部可触摸的精灵美术史
      功能: 重大国典、双主共同颁诏、对黑暗精灵的缺席审判均在此举行；长老议会列席王庭时，木精灵使团的青帐搭设于树侧
    四苑:
      星辉学宫(北苑):
        定位: 高等奥术/星象/政务教育中枢，星辉学塔的大本营
        布局: 七座学塔环绕中央大讲堂，地下为禁咒封存库缄默穹窖
      七芒圣殿(南苑):
        定位: 星辰与自然双重崇拜的最高神殿
        布局: 殿分七厅对应七芒，中庭露天圣池引双辉河活水，冬至"星降节"全城灯火熄灭，唯圣池映星
      翠章苑(东北苑):
        定位: 王庭档案、外交使馆区；索伦蒂斯王国与梵尼亚常驻使馆在此
      誓约苑(西南苑):
        定位: 龙誓骑团在内环的联络所与荣誉厅，陈列历代龙骑士遗甲；骑团本部实际在城郊誓约校场