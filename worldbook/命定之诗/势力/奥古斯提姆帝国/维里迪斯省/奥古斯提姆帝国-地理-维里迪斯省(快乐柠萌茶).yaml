---
维里迪斯省:
  概览:
    帝国中东部的平原行省，介于艾瑟尼亚、碧霜、红丘与索莱尔之间
    帝国最大的产粮与粮食集散区，河渠纵横，庄园与仓廪成片
  地理:
    类型: 冲积平原与河网低地
    青穗平原(中部、北部):
      地理: 省域主体，厚土平原与灌溉渠网交错
      人文: 最富庶之地，田产与佃约之风浓厚
    织渠低地(南部):
      地理: 河汊沼泽与人工排干的洼地农区，堤闸渡桥密集
      人文: 船民与泽民杂居，兼营渔业与编织，习俗较平原松弛
    疏穗缓丘(东西两缘):
      地理: 与邻省接壤的过渡缓丘，田垄零散，疏林与牧野相间
      人文: 驿道市镇繁荣，商旅往来密集
    水系:
      沃野河: 自西北向东南贯穿全省的主干河，水量丰沛，通航里程长
      支渠网: 历代省督与仓署开凿的灌溉漕运体系，兼作旱季供水与雨季泄洪
  气候:
    类型: Dfa，温带大陆性，生长季长
    特征: 平原水汽蒸腾、晨雾常见，霜冻期短，旱涝皆由河渠调剂
  生态:
    植被: |
      以耕地、人工草地与河岸林带为主，原生植被仅存于低地泽畔
  资源:
    农业: 帝国最大的谷物产区与储备地，兼产纤维作物、油料与园圃产物
    水运: 河渠漕运与粮仓群构成帝国粮食动脉
    加工: 磨坊、酿坊与食货工坊集中于城镇与河港
  人文:
    以农立省，重节令、仓廪与水利，金穗节庆典规模冠于帝国
    乡绅与仓吏共治，粮价、仓储与契券文书是地方生活的中心话题
    民风淳厚守序，崇尚勤俭与积储
  特色城镇: 金谷城(省会)
