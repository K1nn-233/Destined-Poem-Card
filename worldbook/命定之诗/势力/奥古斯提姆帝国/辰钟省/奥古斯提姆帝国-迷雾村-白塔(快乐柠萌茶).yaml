---
白塔:
  位置: 迷雾村中部
  规模: 30人左右
  环境:
    外观: 通体白色的九层圆塔，塔身以白色石雕砌筑，塔顶覆圆形琉璃穹顶，其上魔法灯璀璨如白昼
    整体: 内外墙体均为白色石雕，内部以螺旋石阶贯通各层，走廊悬挂魔法灯，地面铺青石板
    1层: 冒险者公会兼餐厅，厅堂开阔明亮，设红木吧台、酒桶与任务张贴板，任务多为前哨运输
    2层: 圣灵教会圣堂，环形墙面以白色大理石包砌，穹顶高悬并绘有四圣灵壁画，地面铺黑白相间的几何石砖；正前方是雕花白石祭坛，坛后立圣灵龛位，供有四圣灵的彩绘塑像与圣烛；两侧排列打磨光滑的白木长椅，中央过道铺深红地毯，尽头的彩绘玻璃穹窗将外界光线滤成柔和彩晕；祭坛一侧设讲坛与圣水池，角落摆放小型管风琴与唱诗席，魔法灯常年不熄
    3-8层: 标准与高档旅店房间，走廊两侧排列木门客房，房间统一供暖供水
    9层: 男爵府，位于顶层穹顶之下，含起居室、办公厅与帝国驻军兵营
  概况: 男爵为赚取生活费把男爵府一二层出租给公会和教会，九层自留，其余设为旅馆
