---
迷雾村:
  位置: 奥古斯提姆帝国-辰钟省南部靠近悲鸣沼泽
  规模: 村庄
  人口构成: 人类96.9%|精灵3%|其他0.1%(商品/奴隶)
  环境: 浓雾弥漫的湿热沼泽，村民木屋散布在村庄小径旁，四周被危险的沼泽森林环抱，白塔高耸于中部
  概况: 
    表面: 帝国驻防村落
    隐秘: 黑市核心据点与魔女庇护所，领主为黑市傀儡
  资源:
    采集:
      稀_炼金材料(沼泽森林)
    交易:
      精灵、翼民奴隶(黑市拍卖会)
      史_物品(不定期拍卖)
    制造:
      普_装备(锻造铺)
      稀_药剂(魔女塔楼)
    教育:
      黑魔法与炼金术(魔女塔楼)
  地点: 锻造铺/冒险者公会/沼泽森林
  特殊地点:
    白塔: 九层宽大圆塔，通体白色，冒险者公会、圣灵教会、男爵府、旅馆所在地，塔顶琉璃与魔法灯如灯塔指明方位
    魔女塔楼: 外观为阴森的砖石堡垒，塔尖常年萦绕诡异光芒，拥有青春魔药的魔女据点
    黑市: 隐藏在白塔地下的庞大交易网络，不定期举办拍卖会
  任务层级: C级(最高)
  生命层级: 3(魔女塔楼)/4(黑市)/2(冒险者公会)