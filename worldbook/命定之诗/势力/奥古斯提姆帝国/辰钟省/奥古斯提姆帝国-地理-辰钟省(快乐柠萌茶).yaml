---
辰钟省:
  概览:
    帝国西南部的湿地与林地行省，北接艾瑟尼亚与驰原，东邻索莱尔，南与西南毗邻无尽树海北缘
    以沼泽与雨林为主，魔导学术与炼金采集并存，是帝国最富神秘色彩的边省
  地理:
    类型: 沼泽湿地与低地雨林
    雾沼低地(中部、南部):
      地理: 省域主体，终年浓雾的泥沼、芦苇荡与季节性泛滥地，航路如迷宫
      人文: 泽民与渡户散布，旧俗禁忌繁多，来历不明的交易传闻亦源于此
    雨林深境(西南部):
      地理: 高大密林与藤蔓层，林下终年阴湿，多魔法植物
      人文: 未辟之地，仅采集队与探秘者涉足，营地随季节迁移
    甘蜜高地(中北部):
      地理: 相对干爽的低缓台地
      人文: 省城与学院建于此，魔导学术与市政并行，学者、学徒与匠师云集
    渡泽林带(东部):
      地理: 向索莱尔省河网平原过渡的湿地林带，堤道与渡口连缀
      人文: 转运贸易活跃，风气较腹地开明
    水系:
      雾江: 纵贯省域的浑绿大江，支流与牛轭湖遍布，航期受水位涨落左右
      米耶洛溪: 自高地流下的清溪，是省内少数可供饮用与驱动水轮的净水水源
  气候:
    类型: Cfa，温带湿润至湿热，雨量集中，雨林深境因终年强降水近Af
    特征: 全省降水最多，雾日与雷暴日众多，土壤常年湿润，夏秋之交偶有风暴自东南沿海侵入
  生态:
    植被: |
      湿地以芦苇、泽生草与耐水乔木为主，雨林为多层阔叶密林，高地与东缘为疏林与耕地
  资源:
    林产与采集: 药用植物、木材与炼金素材的核心产区
    渔业与航运: 河网渔业与沼泽航道运输是地方经济基础
    学术与工造: 魔导研究与药剂、魔法武器制作发达，人才与典籍汇聚
    矿产: 高地与东缘有石料与浅层矿脉
  人文:
    依水而居，船渡、堤栈与浮屋是常态，节令以水汛而非农时划分
    药学、炼金与咒术传统深入日常，民间旧俗与秘传传闻杂糅
    边境人烟稀疏，行旅依赖向导与灯标，林沼间亦有位面残留生物出没的传闻
  特色城镇: 时钟塔城(省会)|迷雾村
