---
艾瑟尼亚省:
  概览:
    都城艾瑟嘉德坐落于中部一片高出四邻的隆起台地上
    帝国礼制、学术与工造的中心，官吏、贵族与学者最密集之地
  地理:
    类型: 中部台地与四缘缓坡平原
    辉光台地(中部):
      地理: 省域核心的隆起高地，都城与卫星聚落皆建于其上，台缘多为断崖与层叠拱廊通路
      人文: 门第与仪典之风最盛，官吏、学者与贵族在此交织
    白垣丘原(北部):
      地理: 浅色岩层出露的低缓丘陵
      人文: 石场与隐修院散布其间，学者与朝圣者往来不绝，风气清简虔敬
    碧野低原(东南部):
      地理: 向维里迪斯、索莱尔方向铺展的平缓农野，沟渠相连
      人文: 供应都城的农工带，庄园与市集秩序井然
    猎风林丘(西部):
      地理: 与驰原省交界处的疏林缓丘，风势偏劲
      人文: 猎场与林务哨所散布，民风粗豪，与西边军镇互市频繁
    雾渡缓野(南部):
      地理: 与辰钟省湿地相接的低平地带，水汽弥漫、渡口密集
      人文: 行旅与货物转运频繁，聚落多兼营渡运
    水系:
      辉光川: 自台地北缘涌泉发源，绕行台地东、南两麓后注入东南平原，中下游可通航
      跃水渠网: 帝国工务院主持的引水与跌水渠系，为都城与近郊供水并驱动工坊
  气候:
    类型: Dfa，温带大陆性，四季分明
    特征: 台地高出四周平原，夏季较凉爽、冬季日照充足
  生态:
    植被: |
      台地与丘原以人工林带、果园与修剪草场为主
      低原为连片耕地与河岸草甸，间存原生阔叶疏林
  资源:
    农业: 谷类与根茎作物，近郊供应型农业发达
    矿产: 建筑石料与烧制用料，深层有零星贵重矿脉
    工造: 皇家工坊与各行业公会总部云集，精工、炼金与符文制品冠于帝国
    学术: 最高学府与各大协会所在，人才与典籍储备为帝国之最
  人文:
    贵族以学历、军功与宫廷职衔标榜身份，官场规矩森严。礼仪规制渗入日常
    公共仪式以圣灵教会为主流，法律上信仰自由，地方信仰并存
  特色城镇: 艾瑟嘉德(首都)|白石镇
