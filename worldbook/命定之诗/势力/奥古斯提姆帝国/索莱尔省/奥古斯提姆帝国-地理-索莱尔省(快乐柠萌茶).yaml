---
索莱尔省:
  概览:
    帝国东南部的农贸与滨海行省，北接红丘与维里迪斯，西邻辰钟省
    园艺、草药与花卉贸易名冠帝国，并承担近海防务
  地理:
    类型: 丘陵盆地平原与海岸带
    翠庭河原(中部、西部):
      地理: 运河水网与平阔农田交织，城镇沿河布列
      人文: 运河集市与园林城镇相连，精细食货交易繁盛
    花丘梯田(北部、西北部):
      地理: 向红丘省抬升的丘陵梯田，温室与园圃成片
      人文: 帝国农学与植物学的研习之地，园丁、药师与学徒众多
    暖湾海岸(东南部):
      地理: 岬湾相间的海岸带，天然良港与外海航线交汇
      人文: 港埠商舶云集，水手与关吏杂处，海港习气浓厚
    金砂旱坡(南部):
      地理: 向赤金沙海方向渐趋干热的坡地，稀草与灌丛增多
      人文: 牧养耐旱畜群并采集旱生药草，商队往来频繁
    水系:
      翠庭运河群: 由主渠与天然河汊连缀而成的水网，航运与灌溉兼用
      诸河下游: 数条自北部丘陵南流的河流在海岸带汇成三角洲，河口设港
  气候:
    类型: Cfa，温带湿润向亚热带过渡，温润舒爽，沿海趋向Cfb
    特征: 日照充足、霜期短，适宜园艺与多年生作物，海岸多海雾与盐风
  生态:
    植被: |
      平原与运河带为耕地、花卉园与河岸林；丘陵多果园、药草坡地与半自然灌丛，南缘转为旱生疏草
  资源:
    农业: 谷类、花卉、药草与园圃产物的主要集散地
    渔业与海产: 东南海岸渔获与盐业，港镇兼营海产加工
    贸易: 沿海口岸承接南方海域与群岛商货，运河集散远及内陆
    工造: 药草制剂、香料与染织等精细作坊发达
  人文:
    重园艺与园林之美，节令花市与丰收祭并行，饮食讲究时鲜
    商农并重，港埠与河市文化浓，行情与契券消息流通极快
    沿海防务由省军与海军分驻，渔汛与巡防构成生活节律
  特色城镇: 翠庭城(省会)|渡鸦港
