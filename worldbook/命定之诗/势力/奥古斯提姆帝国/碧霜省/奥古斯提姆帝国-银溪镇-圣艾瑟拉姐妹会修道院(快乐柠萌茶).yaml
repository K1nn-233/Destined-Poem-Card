---
圣艾瑟拉姐妹会修道院:
  位置: 奥古斯提姆帝国-银溪镇
  人口构成与生命层级: 
    层级4: 1院长
    层级3: 1管理者|2教义学者|1圣骑士
    层级2~3: 72修女
  概况: 银溪镇特许，专奉圣约之护·艾瑟拉，并制售工艺品。收藏并封印大量圣遗物，按属性分置顶层或地下，分间存储
  加护与诅咒: 仅允许女性成员，身体成长极慢，外貌总在随机某个极为年轻或年幼时刻停止成长与真实年龄相差极大，但寿命结束便会直接死去
  成员穿着: 款式多样新颖，精美繁缛
  建筑外观:
    整体: 方院围合，坐北朝南。圣银与本地银纹石砌筑
    围墙: 白色符文石墙环抱，墙头嵌照明水晶与警戒符文；南为正门(双扉银门+门房)；月泪河支渠绕墙而过
    主教堂: 白色三层大理石，尖顶立艾瑟拉托婴银像；外墙镌荆棘纹与圣灵符文，彩窗投圣光于内
  建筑布局:
    主教堂(中央):
      一层: 圣殿(中央圣坛供艾瑟拉圣像、彩窗、洗礼池)
      二层: 生活层(单人、多人房间)
      三层: 光遗物层(圣光常明)
      地下: 暗遗物层(阴凉舒爽)
    餐厅厨房(西南): 雅致长厅，附厨房与地窖
    图书馆(东): 藏书楼收神学、医疗、炼金与遗物典籍，附抄写室
    工作厅(北): 修女制售圣像、药剂、护符、服饰等
    圣泉(北): 修道院主水源，传为艾瑟拉神力所润，能净化与治愈
    接待所(正门内): 朝圣者歇脚、告解与受济
    墓园(北墙外): 修女与受庇者安息地
    其他地点: 钟楼(西南角)|诊疗所与药园(东南)|仓库(西北)