---
银溪镇:
  位置: 奥古斯提姆帝国-碧霜省南部
  规模: 中型城镇
  人口构成: 人类91.9%|精灵4%|兽族2%(商品/奴隶)|翼民(宗教)
  环境: 月泪河穿城而过，沿岸豪宅林立，镇外森林因金属污染呈现诡异银灰色
  概况: 帝国奢侈品加工小镇，贵族云集，治安严密
  资源:
    采集:
      优_炼金材料(森林)
      稀_金属(矿区)
    制造:
      稀_装备(锻造行会)
      优_药剂(商铺)
      史_饰品(银锤街)
    教育:
      稀_魔法/炼金术(书店/魔法协会)
    特殊:
      封印遗物(修道院)
  地点: 银锤街/锻造行会/冒险者公会/魔法协会
  特殊地点:
    锻造行会: 宏伟的穹顶建筑，内部陈列历代大师作品
    圣艾瑟拉姐妹会修道院: 银溪镇唯一圣灵教会，建筑典雅精致，外墙高耸建筑，秘密封印异界与宗教遗物
  任务层级: C级(最高)
  生命层级: 4(城主府)/3(冒险者公会)/4(修道院)/3(锻造行会)