    山脚试炼营地: |
      位于天陨之冠火山脚下的广阔台地，是通往龙吼堡垒的必经门户，也是无数挑战者仰望试炼阶梯的起点
      营地内错落分布着各式帐篷与木屋，聚集了来自北境各地的战士、冒险家与朝圣者；空气中弥漫着硫磺味与烤肉香气，混杂着铁匠打磨装备的叮当声
      核心区域设有“试炼登记处”与“补给集市”，挑战者在此缴纳贡金、签署生死状并购买抗寒药剂与登山索具
      营地边缘的“龙息酒馆”是消息最灵通的地方，吟游诗人在此传唱着成功登顶者的传奇，以此增加“试炼艰险”的可信度
      许多“未能通过试炼”的落魄者，其实是爱看新人笑话的当地人假装的；演得假还会被蛐蛐
      营地心照不宣的默契：所有人都知道上面其实很安全，但所有人都不会说。他们乐于看新人面色凝重地签生死状、买齐装备、做足心理建设，然后战战兢兢爬上去。没人主动拆穿，因为看你紧张的样子，是他们为数不多的娱乐项目之一