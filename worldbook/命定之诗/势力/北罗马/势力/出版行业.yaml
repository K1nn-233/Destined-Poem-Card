    凛冬大学出版社:
      驻地: 白曜城，凛冬大学校园内
      性质: 学术出版
      概述: |
        联盟学术出版的最高权威，由凛冬大学教授会管理
        出版物涵盖四系全部学科的学术专著、教材、学位论文合辑与年度学术纪要
        《凛冬学报》是联盟唯一的综合性学术期刊，每季刊行一期，审稿制度严格
      代表出版物:
        - 《凛冬学报》（季刊，学术论文）
        - 《北境通史》（史学系集体编纂，修订至第七版）
        - 《霜蓝石应用原理》（奥术系教材）
        - 《联邦律法汇编》（行政系年度更新）
        - 《北境矿物志》（博物系，附手绘彩色插图）

    银息书局:
      驻地: 白曜城银息河岸区
      性质: 综合性商业出版
      概述: |
        联盟最大的商业出版机构，百年老字号，由数个出版商家族合资经营
        出版物门类齐全，从严肃历史到通俗故事、从烹饪食谱到旅行指南无所不包
        拥有联盟分布最广的书商网络，在五大公国首府及灰岩镇均设有分销书铺
      代表出版物:
        - 《五色年鉴》（年刊，联盟各公国年度大事记与统计数据，发行量最大的非文学出版物）
        - 《苍白海航路指南》（与霜风商会合作编纂，定期修订）
        - "冰炉丛书"系列（大众读物品牌，涵盖食谱、家政、养畜手册等）
        - 各类通俗小说与故事集

    苍叶印社:
      驻地: 林歌城，河岸木场北端
      性质: 医药与博物出版
      概述: |
        乌尔芬医学院指定的药典与医学文献出版商，兼营博物图谱出版
        以精美的手绘药草插图与严谨的药方校勘著称，出版物在联盟医界具有准法律效力
        纸张全部使用林歌城本地产的玉屑纸，印刷质量为联盟之最
      代表出版物:
        - 《乌尔芬药典》（联盟通用药典标准，每十年修订一次）
        - 《霜叶博物图志》（铁木林海的动植物百科，四卷本，附全彩手绘插图）
        - 《伤科纪要》（战创外科案例汇编，永夜长垣军医的主要参考文献）
        - 《古林语药名对照表》

    潮信社:
      驻地: 凛风渡上城区
      性质: 航海、商贸与通俗读物出版
      概述: |
        霜风商会联盟出资扶持的出版机构，侧重航海技术、贸易法规与港口资讯的出版
        同时是联盟通俗文学市场的重要玩家，大量出版航海冒险故事与捕鲸传奇
        以速度见长，新闻性出版物从接稿到上架可压缩至数日
      代表出版物:
        - 《潮信报》（联盟发行量最大的新闻简报，不定期刊行，内容以航运消息、港口物价与海事事故为主）
        - 《商律通览》（埃吉尔海德商法与联盟跨公国贸易法规汇编）
        - "浊流故事"系列（廉价通俗小说，封面粗糙但故事引人入胜，水手群体中极受欢迎）
        - 《白港捕鲸纪事》（最畅销的非虚构作品之一）

    联邦印务局:
      驻地: 白曜城冠石台
      性质: 官方出版
      概述: |
        隶属联邦大公议会的政府印刷机构，承印所有联邦级法令、行政文书、外交照会与官方公报
        不对外经营商业出版，但其印制的《联邦公报》是联盟境内唯一具有法律效力的官方信息来源
        印务局使用的寒铁合金活字与霜蓝石压印封蜡构成联邦文书的防伪体系
      出版物:
        - 《联邦公报》（不定期，发布法令、任命、宣战与和约等官方文件的唯一合法渠道）
        - 各类行政表格、税单与身份文书的标准印版