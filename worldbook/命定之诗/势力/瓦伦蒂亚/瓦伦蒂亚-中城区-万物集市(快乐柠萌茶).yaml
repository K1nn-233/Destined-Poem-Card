---
    瓦伦蒂亚-万物集市:
      概述: 地上交易低风险物品(书籍、武器、装备、魔宠、炼金、魔导等)，地下交易高风险物品(奴隶、魔物、异界造物等)
      环境:
        桶状石砌建筑，外观宏伟，顶部开天窗，每层都有内部照明，通透明亮
        中心螺旋楼梯链接各层，鉴定区位于每层中心
        地下层光线明亮，依靠镶嵌在墙壁上的魔晶照明
        每层各处设有卫兵保障秩序，商铺林立，各族冒险者摆摊自由交易
      层数: 地上5层，地下3层
      额外设施: 银行、官方鉴定区
      规范:
        鉴定: 高品质物品可申请官方鉴定，避免受骗
        税费: 货币交易收取1%税费
        租金: 商铺每月1万Z;摊位每周1000Z
      风气: 高端物品通常以物易物