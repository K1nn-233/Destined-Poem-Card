  文化:
    文化风貌: 翼民以诚实与守诺为荣，也从不掩饰身为翼民的骄傲。恪守礼仪被视作理所当然，高度的道德自觉渗入日常起居。他们的审美偏爱羽翼与圣纹的光洁——越是无瑕，越值得称许
    仪礼传统: 翼民把圣纹看作与羽翼无异的身体的一部分。亮出圣纹、收拢圣纹、展示圣纹，都是自然而然的仪态，也构成他们日常审美与尊卑表达的一部分。羽翼与圣纹的光洁程度，往往先于言语，说明一个人的来历
    特色庆典:
      初光礼(2月24日): 满月之夜，圣仪院为新生的翼民授予第一道圣纹
      圣翼阅礼(4月18日): 圣翼骑士团在空域列阵阅兵，演练编队，向圣都与教皇宣示守护之责
      圣羽加冕(7月20日): 教皇授予受冠者羽冠与名号；名位由白羽谱库誊录在册
      风铃欢歌节(8月22日): 白石回廊与水岚区挂满风铃与彩带，合唱与赠礼交织在一起，人们以此祝愿众翼安好
      圣光大祈(11月9日): 十一月九日，辉煌祈光日。天尚未暗，全城的翼民便已聚在白石回廊与层台之上。他们以言语、以圣纹祈光；大圣殿的穹顶随之次第亮起，一道共鸣的光潮自殿顶涌出，沿着峰体层层漫下，最终覆满整座圣都
    比翼斗: 贵族若为荣誉或骑士团的路线之争起了争执，会约定一场空中决斗，但必须先经白羽裁庭受理。裂空家与长歌家之间，这样的约定并不少见
    独特法律:
      飞行礼规: 进入核心圣域时，须收翼、收敛圣纹，徒步而行
      外来限制: 无翼者的活动范围受到限制，大多只能停留在水岚区与山脚聚集地
      魔导禁令: 外来的魔导物品须登记在册；违规者会被收缴，并送交审检
