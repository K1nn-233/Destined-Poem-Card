    圣都-穹顶圣域:
      描述: 浮岛悬于圣都之上，殿群与穹顶相扣，白玉与金纹构成垂直轴线。<秘密>整座浮岛本身就是古翼民遗留的战略级空域兵装，圣殿与回廊被封闭的深处通向内部结构</秘密>
      功能: 圣仪主持/神谕发布/圣座议决/圣具维护/古代兵装封存/圣职遴选
      概括:
        环境: 空气冷而干，光束沿中轴落下，风切过岛缘，声低沉
        建筑: 白玉穹顶与环廊叠合，殿群依层台攀升；承重结构厚重，层台之下覆压着封闭的兵装结构
        人文: 高阶教职与贵族出入，行止受礼规约束
      <秘密>
      兵装现状:
        状态: 休眠中，因长期仪礼养护已经完全恢复
        启动条件: 需要完整的接口规范；圣纹源典残卷与圣纹模板仍在，但十二家族无人能读懂
      </秘密>
      地标: 辉煌女神大圣殿，教皇宫，圣女圣殿，教义部，白羽裁庭，圣仪院主殿，圣仪工坊，圣座会议厅，圣选署，浮岛缘台，金白圣阶
      地标详情:
        辉煌女神大圣殿: 穹顶宏伟，内壁刻满圣纹；晨光时，圣纹的光束贯穿中轴，经光导圣柱垂落于圣纹祭坛
        圣仪工坊: 外观朴素，门禁极严，存放圣纹模板与圣具；圣具匠在此行护养之仪——诵出圣典中记载该圣具的章节，以圣纹引导圣光温养，把维护当作礼拜
        圣选署: 掌候补名册、圣纹检选、签筒决序与圣职空缺递补；院令直接呈送圣座会议
        浮岛缘台: 悬于穹顶岛缘的窄长观台，圣选署在此举行候补唱名与递补礼，衡翎家的居所临近一侧
        金白圣阶: 贯通各殿群的主礼阶，石阶内埋有细密金纹，在特定时辰会有流光闪烁
