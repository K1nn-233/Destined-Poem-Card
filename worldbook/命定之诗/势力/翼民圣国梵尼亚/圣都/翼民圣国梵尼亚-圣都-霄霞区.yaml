    圣都-霄霞区:
      描述: 高塔与翼廊围出白石天城，受封家族与高阶教务人员居住，礼仪与声望决定社交秩序；金纹礼标沿廊指引，仪仗在长桥间缓行，晨昏霞光自云海漫上塔尖
      功能: 家族议事/礼制裁决/谱册登记/观礼接待/安眠与封存
      概括:
        环境: 高空风道与廊桥密集，阶台层层上收，晨昏霞色染过塔林，风声低沉
        建筑: 暖白塔连桥，金色礼标与金属饰线点缀廊桥，内向庭院多，岩壁静室深藏
        人文: 受封家族与教务人员居住，圣职卫队巡行于廊桥与塔门之间
      地标: 白羽谱库，圣翼议会厅，审检局本部，圣职卫队营所，天穹观礼台，白羽裁庭，圣翼骑士团空港，霜白长桥，金纹仪仗台，垂天白塔林，圣眠所
      地标详情:
        白羽谱库: 存放血统与圣纹谱系，也就是圣纹形态的图鉴；查阅须经教义部许可，门楣铭刻着家族誓词
        圣翼议会厅: 大主教与骑士团团长议事之处，议事钟声清晰可闻，钟声就是召集令
        圣职卫队营所: 圣域卫戍驻地，日夜轮岗
        白羽裁庭: 贵族纠纷与礼制违犯的裁决处，也受理荣誉决斗之约，裁词经钟声传示
        霜白长桥: 连接垂天白塔林的主桥，阅礼日仪仗自此缓行
        垂天白塔林: 霄霞区最高耸的集束塔群，受封十二家的邸宅所在，各塔悬家族徽记，侧塔住着世代家臣；原有十三座塔基，现存十二座
        废塔: 垂天白塔林西角的第十三家旧塔，封门闭窗，风雨侵蚀而无人修缮
        圣眠所: 教廷辖下归寂派主持的安眠与封存机构，设于塔林后的岩壁静室，在此收存亡者的归寂盏，封存两次位面战争遗留的异界遗骸与禁忌圣具
