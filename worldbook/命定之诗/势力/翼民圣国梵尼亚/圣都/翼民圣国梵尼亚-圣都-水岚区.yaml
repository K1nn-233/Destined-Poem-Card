    圣都-水岚区:
      描述: 圣都最外缘的层台与工坊区，岩壁住居层层嵌入，台地街巷在风道间盘旋；晨昏山雾水岚漫上低台，木色栈道抵御强风，熔炉热浪与香盐气息沿回廊扩散
      功能: 工坊生产/贡赋交接/外来接待/物流转运/起降集散
      概括:
        环境: 山体层台与翼台相连，栈道与梯桥交错成垂直路网，晨昏雾岚自崖下漫涌，暮色时灯火沿栈道成列延伸
        建筑: 白石基座嵌在岩壁里，木色栏棚与栈桥沿崖铺展，嵌壁住居外挑檐廊，屋顶与连廊都成了路
        人文: 工坊翼民与侍从混居，秩序由圣务局外署与圣职卫队维持
      地标: 圣务局外署，圣务局总署，白石工坊街，祈光食坊，低翼居，风翼台阶，起降台群
      地标详情:
        圣务局外署: 贡赋与物资的交割点，工坊排班与配给的告示常贴满石壁
        圣务局总署: 水岚区的行政中枢，统筹配给与外来者事务
        白石工坊街: 熔炉群的所在，匠师按圣仪院所定的模板锻造礼器与圣具胚件；成器送圣仪院验纹、登记、入库，合格的才列为圣具，由圣仪院统一管理，光尘与香盐气息常年不散
        风翼台阶: 通往云钟区的盘旋阶与翼台起点，货队在此集结
