  神迹群山地理概览:
    宏观地貌: 神迹群山纵贯大陆中北部，主峰孤拔于云海之上，群峰如展开的翼列，层层抬升，断崖与深谷交错，云海自崖下翻涌。群山上空悬浮着众多浮岛。山腹与山麓是登山朝圣与物流的必经地带，群山深处散布着山中聚落、仪式场所与采掘地。群山全境都在翼民的势力范围之内，边缘地带则散布着异族与帝国的聚居地
    空域总括: 群山上空的浮岛星罗棋布，形态各异，表面覆盖着葱郁的植被与青苔。它们多为荒废的奇观，翼民视之为自然的神圣之地，只依外观取名。唯有圣都上空那座承载圣殿群的浮岛，因圣殿所在而受礼制保护，其余浮岛则无人过问
    区域构成:
      主峰圣域: 群山的最高峰，圣都所在，也是翼民核心的宗教与直接统治区域。"圣域"一词仅指主峰一带，也称"天空圣域"
      群峰地带: 主峰之外的群山主体，群峰如翼列展开，公共机构与职守家族散布于各峰之间，孤山与矿峰点缀其间
      山谷地带: 群峰之间的谷地与河谷，溪泉汇流，村落、梯田与巡礼路线沿谷分布，是翼民烟火最密的地方
      山麓地带: 群山向大地垂落的过渡地带，山脚聚集地是朝圣的前站与外族贸易的门户
      群山空域: 圣都上空为穹顶圣域所在，其余空域的浮岛散布其间
      群山边缘: 外缘地带，异族与帝国的聚居地散布，属正常情形
    主峰峰顶: 圣都所在，四周尽是断崖，常年硬质晴光与强风，昼暖夜寒，空气稀薄
    气候: 自山麓的温带湿润，到主峰的高寒干燥，垂直分带分明。云海线上下是两重天，断崖风急，山口云岚浓重，冬季积雪封道
    城镇:
      圣都: 峰顶的圣都，以垂直礼制与空域秩序组织空间
      山脚聚集地: 登山朝圣与物流中转的前站，外族贸易与补给集中于此，旅舍与集市密集
      栖羽城: 半山腰向阳台地上的翼民聚居小城，有市集与工坊，山道联通圣都与山脚
      净羽台: 圣路巡礼中段的歇羽静修地，巡礼者在此净羽祈愿，大修道院的僧侣也自此下山清剿
      五峰公共设施: 曙峰（教义部、谱库、裁庭）、霜崖（圣具锻造坊）、风切崖（空战训练场）、炽岭（卫队屯驻）、月岭（功勋碑林）——各由一家世家世代掌理
      眠云岭: 群山深处的孤山，云岚绕顶，静翎家在此封库，是圣眠所体系在群山的延伸
      光砾坪: 半山崖坪上的圣光矿采掘聚落，矿道直入云海断崖的矿脉
      浴羽屿: 云海浮岛，求婚系羽的许愿圣地，翼民口中称之为"定情屿"
      云巢屿: 云海浮岛，藤蔓如巢，是翼民聚会晒羽与风铃节庆的地方
      月池屿: 云海浮岛，岛心有一汪无源的静池，满月之夜，翼民围池祈愿
    重要地点归属:
      主峰圣域: 圣都（水岚区、云钟区、霄霞区）、穹顶圣域
      群峰地带: 曙峰（教义部、谱库、裁庭）、霜崖（圣具锻造坊）、风切崖（空战训练场）、炽岭（卫队屯驻）、月岭（功勋碑林）、眠云岭、光砾坪
      山谷地带: 栖羽城、净羽台
      山麓地带: 山脚聚集地
      群山空域: 浴羽屿（定情屿）、云巢屿、月池屿
      群山边缘: 石蒜城、圣日镇
