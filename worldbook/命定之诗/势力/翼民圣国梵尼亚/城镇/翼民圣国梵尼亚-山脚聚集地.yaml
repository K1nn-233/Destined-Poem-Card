  山脚聚集地:
    描述: 崖脚前站，台市与栈道叠合，朝圣者与商旅络绎往来，灯火沿山壁延伸
    功能: 朝圣前站/外族贸易/物流转运
    概括:
      环境: 云雾低垂，石阶与吊桥连驿，夜火映照山壁，风铃声此起彼落
      建筑: 石木台地与临崖仓栈并列，驿站与货栈为主，临时翼棚随风摇曳
      人文: 外族商旅与本地脚夫混居，信仰朴素，贡品与货币并行，市声不绝；朝圣者由圣务局外署引导入山道，入夜可眺峰顶圣纹的微光
    地标: 祈光驿站，天阶集市，朝圣者坞，风铃坡道，圣翼驮运台，云栈关，垂羽礼拜堂
    地标详情:
      圣翼驮运台: 空中货物交接平台，货队常驻
      云栈关: 进入山道的关口与税栈
      垂羽礼拜堂: 崖壁凹陷处的古老石砌建筑，彩绘玻璃窗向山谷投射出羽翼形的光影
