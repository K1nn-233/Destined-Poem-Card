  光砾坪:
    描述: 半山腰向阳的崖坪，云海在坪下翻涌，崖间矿道纵横。采掘翼民世代居此，以采掘圣光矿为业，矿石经集运台由圣翼驮运台转运下山，供水岚区工坊熔炼。石木房舍沿崖错落，晾架、矿棚与集运台相间；坪口石龛立着女神像，出工前翼民亮纹祈祝，收工后逐羽理羽。光砾矿道沿云海断崖矿脉开凿，出产圣光矿石，深部凿至封脉壁
    功能: 圣光矿采掘/矿石集运/山腹聚落生活
    概括:
      环境: 半山崖坪向阳，云海在坪下翻涌，崖间矿道纵横，石屑与光尘随风弥漫，晚霞染红矿口
      建筑: 石木房舍沿崖错落，晾架、矿棚与集运台相间，坪口石龛低小，矿道口悬着风铃镇声
      人文: 采掘翼民世代居此，以采掘圣光矿为业，自视为敬神之业
    地标: 光砾矿道，女神龛，集运台，晾羽坪
    地标详情:
      光砾矿道: 沿云海断崖矿脉开凿，出产圣光矿石，供水岚区工坊熔炼；最深处凿至一面乳白硬壁，纹路细密如羽，凿之不动，矿工称之为封脉壁，出工前都要向壁行礼；老矿工说，女神封的脉，凿不得
      女神龛: 坪口低小的石龛，出工前翼民在此亮纹祈祝，龛前长年供着白石
      集运台: 崖畔矿石集运之处，货队经圣翼驮运台转运下山
      晾羽坪: 坪中空场，黄昏时翼民在此逐羽理羽、收纹，诵圣典中咏羽的章节，节拍合于崖间风声
