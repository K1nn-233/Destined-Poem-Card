  霜崖:
    描述: 群山北壁的背阴崖壁，终年凝霜，冰瀑自崖檐垂落，冷泉自崖顶汇下。圣仪院的圣具锻造工坊嵌于崖壁，凡是圣国重器都在此铸成；圣具匠自崖顶引冰泉冷淬，新成的圣具须在淬霜池受一夜霜验，才算成器。匠师轮值净洗器物、燃香拂尘。崖底的旧窑炉群被冰层封住，冰面平整如铸，冰下拱架成排，无入口可入
    功能: 圣仪院圣具锻造工坊，圣具冷淬与终验之所，圣国的重器都由此出
    位置: 群山北壁终年凝霜的背阴崖壁，冷泉自崖顶汇下
    概括:
      环境: 崖壁终年霜雪，冰瀑垂落，炉火与霜气相接，冷泉自崖顶汇下，水汽弥漫
      建筑: 圣具锻造坊嵌于崖壁，坊门悬着银羽凝霜徽记，淬霜池设在崖边，拂尘斋依坊而居，崖底旧窑群冰封不开
      人文: 圣仪院的高阶圣仪官与圣具匠世代铸具、冷淬、终验，匠师轮值净洗器物、燃香拂尘，司净化仪礼与工坊杂务，偶在旧图谱的边角添注新验
    地标: 圣具锻造坊，淬霜池，拂尘斋，冰封炉群
    地标详情:
      圣具锻造坊: 崖壁间的锻造坊，圣具匠世代在此铸具，以冰泉冷淬，坊门悬着银羽凝霜徽记
      淬霜池: 崖顶冰泉汇成的池，新成的圣具须在池中受一夜霜验，才算成器
      拂尘斋: 匠师轮值的居所，掌净化仪礼与工坊杂务
      冰封炉群: 崖底冰封的旧窑炉群，传说为圣律天穹核心的铸成之处，冰面平整如铸，冰下拱架成排，无人入内
