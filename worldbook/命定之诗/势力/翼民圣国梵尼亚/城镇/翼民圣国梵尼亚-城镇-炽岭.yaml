  炽岭:
    描述: 群山腹地的赤色山岭，地火活跃，热泉沿谷涌流，蒸汽终年不散。圣职卫队屯所沿岭设置，操练轮值日夜不断，是圣国卫戍屯驻之地，卫队军官多由此出；热泉阵供卫队温甲歇羽。深谷尽头有旧闸门擎火闸，铸满火纹，终年紧闭，卫队世代看守
    功能: 圣职卫队屯驻之地，地火热泉守御之所，卫队军官育成之地
    位置: 群山腹地，地火活跃的赤色山岭，热泉蒸汽终年不散
    概括:
      环境: 赤岭透出地火，热泉沿谷涌流，蒸汽弥漫，入夜谷底红光上漫
      建筑: 圣职卫队屯所沿岭设置，军旗绣赤羽擎火徽记，热泉阵散布谷间，深谷的擎火闸终年紧闭，殉火碑立在岭边
      人文: 卫队轮值操练日夜不断，在热泉温甲歇羽，守御群山隘口；殉火碑铭刻当年封锁圣域入口殉身的卫队先辈，供群翼凭吊
    地标: 卫队屯所，热泉阵，擎火闸，殉火碑
    地标详情:
      卫队屯所: 圣职卫队轮驻的军寨，操练轮值日夜不断，军旗绣赤羽擎火徽记
      热泉阵: 岭间的地火热泉，蒸汽氤氲，卫队在此温甲歇羽
      擎火闸: 深谷尽头的巨大旧闸门，铸满火纹，卫队世代看守从不开启，传说门后封着地火之核
      殉火碑: 铭刻当年封锁圣域入口殉身卫队先辈的石碑，翼民与卫队常来凭吊
