  风切崖:
    描述: 群山西缘的风口险崖，罡风常年灌崖，与月岭隔岭相望。圣翼骑士团的空战训练场设在崖边，分翼机动战法在此世代演练，是骑士团将官与教官的育成之地、翼骑士受训的起点。风舍依崖而筑，掌备羽整甲，战前为出阵的翼骑士理羽上甲。崖冠立着铁灰的旧桩落雷桩，风雨不锈，桩顶凹槽齐整
    功能: 圣翼骑士团空战训练场，分翼机动战法演武之地，骑士团将官与教官育成之地
    位置: 群山西缘的风口险崖，罡风常年灌崖，与月岭隔岭相望
    概括:
      环境: 险崖被罡风常年切割，风道纵横，云层低伏，旗台在风中猎猎
      建筑: 空战训练场设在崖边，风舍依崖错落，崖冠的落雷桩孤峙
      人文: 翼骑士在此世代受训，分翼机动战法演武不辍，风舍掌备羽整甲、战前理羽上甲
    地标: 空战训练场，风舍，落雷桩，雷羽旗台
    地标详情:
      空战训练场: 崖间风道的演武之地，分翼机动战法世代演练
      风舍: 依崖的居所，掌战前备羽整甲
      落雷桩: 崖冠的铁灰旧桩，风雨不锈，桩顶凹槽齐整，传说是古时驯雷留下的
      雷羽旗台: 峰口的旗台，悬着雷羽裂云徽记，罡风常扯得旗幡猎猎
