  浴羽屿:
    描述: 云海浮岛，岛形狭长如橄榄，两端收尖，东西长约二十公里，最宽处约六公里。岛上长满野橄榄与紫藤，岛缘悬着一道细瀑，常年有人往来，翼民称它"定情屿"。岛西端立着一对相拥的翼民石像；翼民视石像为许愿最灵之处，在此举行求婚、订婚等人生礼仪。求婚者取翼上最白的一羽系于像前石栏，满栏白羽。石像脚下有一条笔直贯穿全岛的脊线，石像立在它的尖端，面向云海深处。<秘密>圣造浮岛——古代翼民空舰，位面战争时期的空中战舰，休眠残损，覆满植被。它以天然空岛为基座改造，笔直的脊线就是舰首主梁；石像是古时舰首所立的翼民纪念雕像，今人误认为女神像。内部存有休眠的驱动结构与圣纹接口，深入探查或可发现军备残骸与操作遗存。</秘密>
    功能: 求婚/订婚等人生礼仪之所，许愿圣地，日常化仪式承载地
    概括:
      环境: 云海浮岛，野橄榄与紫藤满生，岛缘细瀑悬落，常年有翼民往来，晨昏云岚漫过树梢
      建筑: 岛西端石栏环立，栏后一对相拥的翼民石像，衣纹羽翼刻尽细腻，风雨磨去棱角
      人文: 老人传述女神在此应允首对爱人的誓约，年轻翼民视石像为许愿最灵之处
    地标: 女神像，石栏
    地标详情:
      女神像: 一对相拥的翼民石像，衣纹与羽翼刻得极尽细腻，面容祥和，千百年来风雨磨去棱角
      石栏: 像前环栏，满系白羽，风一吹，满栏白羽如雪
