  净羽台:
    描述: 圣路巡礼中段的崖台，一道细泉自崖缝涌出，汇为不冻的浅泉。巡礼者在此歇羽净羽，把旧羽投入泉中祈愿；崖壁凿有静室，巡礼者或驻留一日，或静修数旬。大修道院的僧侣自此台分岔下山，清剿野兽、处理偏远村落的异界干扰，归来也在泉边净羽。台缘立着圣路记程碑。泉无泉脉，水自石缝层层漫上，终年不涸
    功能: 圣路巡礼中段歇羽静修地，巡礼者净羽祈愿之所，大修道院下山清剿与巡访的分岔点
    位置: 圣路巡礼半程的崖台，崖泉不冻，山道自此分岔下岭
    概括:
      环境: 半山崖台临风，细泉自崖缝涌出汇为浅泉，终年不冻不涸，台畔山风穿隙
      建筑: 崖壁凿有巡礼静室，台缘立着圣路记程碑，泉边石栏低环，台上歇羽坪平整
      人文: 这里是圣路巡礼与大修道院巡访共用的歇羽净羽点，投羽祈愿之风世代相沿
    地标: 洗羽泉，巡礼静室，圣路碑，歇羽坪
    地标详情:
      洗羽泉: 崖台浅泉，终年不冻不涸，巡礼者净羽投羽祈愿之处，泉底石板刻着同心圆纹
      巡礼静室: 崖壁凿出的石室，供巡礼者静修驻足
      圣路碑: 记程石碑，大修道院僧侣下山清剿与巡访自此分岔
      歇羽坪: 台顶平整的石坪，巡礼者歇羽晒羽之所
