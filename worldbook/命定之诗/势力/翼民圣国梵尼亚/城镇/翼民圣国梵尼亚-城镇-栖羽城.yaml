  栖羽城:
    描述: 半山腰的向阳台地，石木屋舍依山层叠，山道纵贯，西通圣都，东下山脚聚集地。这里是翼民聚居的小城，也是日常商业与工坊所在：集市沿山道铺开，光尘花蜜酒、羽器、石料与山货往来；城央的圣光礼拜堂司日常礼拜与婚嫁丧仪等人生礼仪。翼民日出四散，采掘者进崖、工匠入坊、行商出山道，日落归城收羽歇息
    功能: 半山腰翼民聚居小城，日常商业与工坊，礼拜与人生礼仪之地，山道联通圣都与山脚
    位置: 半山腰的向阳台地，山道纵贯，西通圣都，东下山脚聚集地
    概括:
      环境: 半山阔台向阳，云海在城下翻涌，山道盘城而过，灯火入夜层层亮起
      建筑: 石木屋舍依山层叠，市集沿山道铺开，圣光礼拜堂居城央，城缘翼棚列列
      人文: 礼法严整，婚嫁丧仪都循圣光秩序；市集与工坊的日常喧嚣与礼拜钟声共存
    地标: 栖羽市集，圣光礼拜堂，云梯山道，旧平台
    地标详情:
      栖羽市集: 沿山道的半山集市，蜜酒、羽器、石料与山货往来
      圣光礼拜堂: 城央的礼拜堂，日常礼拜与婚嫁等人生礼仪之所
      云梯山道: 盘山长阶，西通圣都、东下山脚聚集地，商队与巡礼者往来不绝
      旧平台: 礼拜堂地下的巨大旧平台，苔覆表面，一角光滑如铸
