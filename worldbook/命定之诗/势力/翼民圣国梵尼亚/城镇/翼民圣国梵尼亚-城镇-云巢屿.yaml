  云巢屿:
    描述: 云海浮岛，岛形近圆如巢，径约四公里，岛面隆起如穹顶，云海在岛缘翻涌成壁；野藤与老枝自岛缘垂覆至岛底，藤蔓缠生如织，翼民称它"云巢"。它是天然浮岛，也是翼民日常聚会、晒羽与风铃节庆之地：岛坪无屋舍，藤架与风铃满布，石台低伏可供坐卧，岛缘老枝盘结成回廊；风铃节时满岛挂铃，风过叮当作响
    功能: 翼民日常聚会/晒羽/风铃节庆之地，云海中的歇息之所
    概括:
      环境: 浓绿浮岛，野藤垂覆岛缘与岛底，风过全岛轻晃，云海在四周翻涌，藤影里鸟雀成群
      建筑: 岛坪无屋舍，藤架与风铃满布，石台低伏可供坐卧，岛缘老枝盘结成天然回廊
      人文: 年轻人偏爱藤影深处，翼民视云巢为云海中的歇脚处
    地标: 藤影回廊，晒羽坪，风铃架
    地标详情:
      藤影回廊: 岛缘老枝盘结的天然回廊，藤蔓垂覆如帘，翼民爱在廊下闲坐，风过时整廊轻响
      晒羽坪: 岛坪开阔处，风铃节挂铃、平日晒羽理羽之所，石台低伏，坐卧都相宜
      风铃架: 风铃节时满岛挂铃，风过处叮当响成一片，是云巢最热闹的时节
