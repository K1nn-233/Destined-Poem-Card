  眠云岭:
    描述: 群山深处的孤山，偏离朝圣大道，云岚终年绕山不散。看守翼民依归寂礼法轮值守护山中封存的旧物；山中封存着异界遗骸、禁忌圣具与蚀界污染样本，是归寂礼法与净化仪式的执行地，也是圣眠所体系在群山的延伸。石砌封库嵌于山腹，库门悬着垂羽徽记；山腰的归寂坪设在崖边，崖壁凿有静室与经房，崖间净化井的井壁嵌着圣纹，供器皿净洗与净化之仪
    功能: 封存与看守异界遗骸/禁忌圣具/蚀界污染样本，归寂礼法与净化仪式执行地，圣眠所体系在群山的延伸
    概括:
      环境: 孤山冷僻，云岚不散，草木低伏，崖壁长年滴水，山风自垭口灌入，昼夜都静
      建筑: 石砌封库嵌于山腹，回廊与静室沿崖错落，库门悬着垂羽徽记；山腰的归寂坪设在崖边，坪侧石塔低伏
      人文: 看守翼民轮值而居，世代传习归寂礼法，轮值封存旧物、执行归寂礼、抄录经卷，与圣都圣眠所同承一脉
    地标: 封库，归寂坪，崖壁静室，净化井
    地标详情:
      封库: 山腹石库，门楣刻着垂羽纹，库中封存异界遗骸、禁忌圣具与蚀界污染样本；旧物多不辨来历，看守只记下它们的名目与年份，世代按归寂礼法封存
      归寂坪: 山腰临崖的石台，归寂礼法执行的地方，看守在此收存亡者的归寂盏，诵礼低声，入夜坪沿悬灯如豆
      崖壁静室: 嵌于崖壁的居所与经房，看守轮值歇息、抄录礼法之处，窗对云海，日短夜长
      净化井: 崖间一井，井壁嵌着圣纹，汲取圣光炼净，供器皿净洗与净化之仪，井口常年萦绕淡白光尘
