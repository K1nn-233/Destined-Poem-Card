  政治与社会:
    权力结构:
      结构: 绝对的政教合一。教皇的敕令与圣女的神谕是最高意志，世俗律例与宗教教义高度统一
      最高权威: 教皇、圣女与圣座会议（由十二位枢机主教与圣翼骑士团团长组成）
      核心教务: 教义部掌教理，白羽裁庭掌裁决
      圣仪体系: 圣仪院掌管礼仪，执掌礼器，并负责圣纹的传承与圣具的维护
      行政与教育: 圣务局与圣选署掌行政，学堂院掌教育，治愈院掌医疗与慈善
      军备:
        圣翼骑士团: 大陆最强的空中军事力量，护卫圣都，巡防边境
        圣职卫队: 负责卫戍、城内秩序与圣域安保
      组织原则: 教廷各部院、军队、圣具与谱库都直属教廷与圣座会议。受职之后，效忠的对象是女神与全体翼民，教令高于家令
    阶级体系:
      结构: 教廷居于一切门第之上，贵族家族的名位与祖业都受教权约束
      圣阶: 教皇 > 侍神圣女 > 圣翼骑士团长 > 枢机主教 > 大主教、候补圣女 > 主教 > 翼骑士 > 祭司、牧师 > 圣仪大师 > 信众 > 外族侍从
      重要序列:
        圣座序列: 教皇、侍神圣女、候补圣女、枢机主教、圣翼骑士团长
        教务序列: 大主教、主教、牧师、祈言师
        圣仪序列: 祭司、圣仪大师、圣仪官、圣具匠
        武备序列: 圣翼骑士团长、翼骑士、圣职卫队官
    门第:
      世家: 第二次位面战争后，教廷以圣羽加冕礼编定十三席；其中一家除名，现存十二大家族
      传承: 各家靠祖业与世代职守延续影响，子弟多入圣职、军职与工坊；世家世代深耕某些机构，高职惯例出于某家。但教廷保有最高任命与罢黜之权
      荣耀: 家族名声重于性命；受了羞辱的人以比翼斗洗刷，世仇世代相传但不得逾越教廷默许之界
      骑士之道: 荣耀、忠诚与守护，是世家立身之本；凭战功、学识与操守博取声名，事迹刻于家碑
    教律:
      诵典: 翼民自幼背诵圣典的章节，晨昏各诵一遍，诵声与体表圣纹相应
      仪轨: 一切仪式都按传承的规定进行
      戒条: 诚实、守诺、洁羽为立身之本；外来的魔导之物须登记，违者由白羽裁庭裁决
      圣事: 初光礼、展翼礼、净羽礼、加冕礼等，都由圣仪院主持
    对外关系:
      友善: 精灵
      死敌: 位面之敌及其残余
