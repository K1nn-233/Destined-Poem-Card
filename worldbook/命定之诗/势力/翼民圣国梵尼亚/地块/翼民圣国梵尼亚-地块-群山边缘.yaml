    群山边缘:
      概览: |
        神迹群山向大地低伏下来的外缘，翼民总体势力范围的模糊边界。群峰收势，林线渐缓，河谷向平原展开，异族的聚居地散布其间，石蒜城、圣日镇就属于此类；边缘的翼民居于坡地小村与哨所，与异族比邻而居，圣翼骑士团的空骑沿山缘巡防
      地理:
        类型: 高山向平原过渡的外缘地带，翼民势力范围的模糊边界
        主要地形:
          外缘山脊: 群峰收势的丘陵与低山，林线渐缓
          河谷: 出山水系切开山缘，沟通群山与平原
          山口与驿道: 商旅与巡防必经的出山通道，聚居地大多沿着它们散布
          古石台: 山脊上孤立的石台与风蚀柱，风化圆钝，齐整地指向同一方向
        气候:
          类型: 山缘过渡性气候，较山内温和
          温度: 四季分明，谷地冬季有霜
          风与降水: 山风与平原气流交汇，降水沿山缘分布，时晴时雨
          特征: 晨昏林线雾气缭绕，入夜平野灯火远连
      生态:
        植被: |
          针阔混交林渐次过渡为平原林带，林缘草甸与灌丛相接
          河谷梯田与牧场沿水分布
        动物: 山地兽类与平原禽鸟在此交汇，牧场畜群与驮队往来
      资源:
        农业: 河谷耕地与坡地牧场，出产谷物、牲畜与奶品
        贸易: 山外货殖进出集散，盐铁与山货在此交换
        矿产: 外缘丘陵偶出铁矿与石料
        探索: 古石台与山脊遗构深处偶见传说品质的材料与物品
      主要节点:
        石蒜城: 群山边缘的聚居地，异族与帝国在此定居往来
        圣日镇: 群山边缘的聚居地，外缘人烟散布的寻常一例
        外缘哨所: 圣翼骑士团边境巡防的营地，沿山缘布列，翅影巡于林线上空
        山口驿站: 出山商路上的歇脚与易货之处，两地方言在此混作一片
