    山麓地带:
      概览: |
        神迹群山向大地垂落的地带，山脉与平原相接。山脚聚集地贴着断崖展开，台市与栈道叠合，是朝圣前站与外族贸易、物流转运的中转之地；货队经圣翼驮运台转运物资，朝圣者自此踏上登山长阶
      地理:
        类型: 山脉向平原过渡的山麓地带，朝圣、外族贸易与物流转运的枢纽
        主要地形:
          崖脚断崖: 山脉与平原相接的壁面，断面平整，山脚聚集地依崖展开
          山麓缓坡: 断崖脚下向平原缓降的坡地，驿道由此分入群山与外界
          溪谷: 山泉汇流的谷地，供水聚落，谷口为外族商队歇脚处
          古断面: 山麓断崖平整如切，非风雨侵蚀所成，垂羽礼拜堂嵌在它的凹陷处
        气候:
          类型: 山麓温带湿润气候，较峰上温和
          温度: 昼夜温差小于峰上，夏凉冬温
          风与降水: 云雾多，山风沿谷道灌下，降水较山内丰沛
          特征: 晨昏雾气重，风铃声随气流此起彼落
      生态:
        植被: |
          山麓为阔叶林与灌丛，谷地梯田与果木园相间
          断崖壁面生苔，聚落周边广植遮风乔木
        动物: 山地兽类与禽鸟，驮马驮牛沿驿道往来，是山麓最常见的活物
      资源:
        农业: 谷地梯田出产谷物与蔬果，供养聚落并接济进山的人
        林产: 山麓林材供给台市建筑与栈道
        贸易: 外族商品与山中物产在此集散，贡品与货币并行，是群山主要的对外窗口
        探索: 古断面与崖壁深处偶见传说品质的材料与物品
      主要节点:
        山脚聚集地: 山麓前站，朝圣前站/外族贸易/物流转运，台市、栈道、驿站与货栈叠合
        垂羽礼拜堂: 崖壁凹陷处的古老石砌建筑，彩绘玻璃窗向谷地投射出羽翼形的光影
        圣翼驮运台: 空中货物交接平台，货队常驻，连接山麓与群峰的转运
        云栈关: 进入山道的关口与税栈，朝圣者由此入山
