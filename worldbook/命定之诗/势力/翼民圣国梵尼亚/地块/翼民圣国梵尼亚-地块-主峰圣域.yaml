    主峰圣域:
      概览: |
        神迹群山最高的主峰，圣都所在，也是翼民圣国梵尼亚核心的宗教与直接统治区域，翼民也称它为"天空圣域"。峰顶高寒干燥，空气稀薄，水岚、云钟、霄霞三区沿峰盘旋，白石台地与回廊层层上收；圣都上空悬着穹顶圣域，教皇宫与辉煌女神大圣殿筑在它上面，如今休眠
      地理:
        类型: 高山峰顶圣域，圣都所在的核心宗教与直接统治区域
        主要地形:
          主峰: 神迹群山的最高峰，孤拔于云海之上，四周尽是断崖，群峰如展开的翼列，层层向它抬升
          峰顶台地: 圣都所在，白石台地与峭壁相接，水岚、云钟、霄霞三区沿峰体盘旋
          垂天白塔林: 峰顶的礼制塔林，受封家族的名位与功业誊录于此，西角空余着一座废塔
          穹顶圣域: 圣都上空悬浮的圣造浮岛，在整个体系中也算最强、层级最高的一座；如今休眠，完整接口规范的解读之法已经失传
        气候:
          类型: 高山寒原气候，全年高寒干燥，空气稀薄
          温度: 昼夜温差极大，昼暖夜寒
          风与降水: 强风频繁，硬质晴光为主，云海线上方少见雨雪
          特征: 峰顶近乎不见雨雾，云海在脚下翻涌
      生态:
        植被: |
          峰顶台地几乎无林木，岩隙里生着苔藓与矮草，背风处伏着耐寒的灌丛
          圣都回廊与层台之间广植石鉢光尘花，依礼制四季养护
        动物: 高山猛禽与云海飞兽掠空，栖于断崖；峰顶的常住民唯有翼民，陆行的兽类罕至
      资源:
        供给: 峰顶几乎不出产，物资多靠群峰采掘与山麓转运接济
        知识: 圣纹源典残卷、圣纹模板与圣具分藏于圣仪工坊与白羽谱库，是圣国最贵重的保管物
        工艺: 圣都工坊熔炼圣光矿、锻造圣具，技艺靠师徒与礼制传承
      主要节点:
        圣都: 峰顶圣都，垂直礼制与空域秩序交织的白石之城，水岚、云钟、霄霞三区沿峰盘旋，长阶与连桥贯通各层
        穹顶圣域: 圣都上空的圣造浮岛，教皇宫与辉煌女神大圣殿所在；如今休眠，圣纹源典残卷与圣纹模板仍在，解读之法却已失传
        垂天白塔林: 峰顶的礼制塔林，受封名位与功业誊录于此，西角空余着背教一家的废塔
