    山谷地带:
      概览: |
        群峰之间的谷地与河谷，翼民聚落与农耕最密集的地带。溪泉汇成溪涧沿谷流淌，两岸梯田与果木园相间，村落依水而居，石木屋舍沿坡层叠；山道沿谷穿行，串联起村落、崖台与巡礼点，栖羽城在半山台地上，净羽台在圣路巡礼途中
      地理:
        类型: 群峰之间的谷地与河谷，翼民聚落与农耕最密集的地带
        主要地形:
          河谷: 溪泉汇流的谷地，两岸梯田与果木园相间，村落沿水分布
          山间盆地: 群山环抱的小型盆地，土厚水丰，聚落多择此而居
          半山台地: 谷壁上缘的向阳台地，栖羽城等城镇所在
          溪涧: 崖泉汇流的小溪，供水聚落与梯田，谷口汇入山前水系
          废弃涵洞: 深谷中砌死的古涵洞，洞口藤蔓盖满，溪水自洞壁缝隙渗出
        气候:
          类型: 山地谷地气候，较峰上温和湿润
          温度: 谷底温凉，昼夜温差较峰上小
          风与降水: 晨昏雾气重，降水较峰上丰沛，冬季谷底有霜
          特征: 云海在谷口翻涌，雾顺谷道灌入，一日之内晴雾数变
      生态:
        植被: |
          谷底为阔叶林与灌丛，梯田与果木园相间
          谷壁生着苔藓与蕨类，聚落周边广植耐寒果木
        动物: 溪涧的鱼虾与禽鸟，驮畜沿谷道往来，是谷地最常见的活物
      资源:
        农业: 梯田出产谷物与蔬果，是群山主要的粮食来源
        淡水: 溪泉汇流，供聚落、梯田与驿道取用
        山货: 果木与山货沿谷道集运，供栖羽城集市与山麓转运
        探索: 深谷遗迹与废弃涵洞偶见传说品质的材料与物品
      主要节点:
        栖羽城: 半山腰向阳台地上的翼民聚居小城，有市集与工坊，山道联通圣都与山麓
        净羽台: 圣路巡礼中段的崖台，巡礼者在此歇羽净羽、投羽祈愿，大修道院僧侣也自此下山清剿
        山中村落: 沿谷散布的翼民村落，种田、酿酒、养驮畜，是谷地最常见的聚落形态
