    群峰地带:
      概览: |
        主峰之外的群山主体，群峰如翼列层层抬升。各峰设有翼民的公共机构：教义部与谱库在曙峰，圣具锻造坊在霜崖，空战训练场在风切崖，卫队屯所踞守炽岭，功勋碑林立在月岭；群山深处另有孤山眠云岭，以及采掘圣光矿的光砾坪。峰间的山道以石阶、吊桥与驿站相连，直通主峰圣都
      地理:
        类型: 高峻山地，主峰之外的群峰主体地带
        主要地形:
          云海断崖: 峰间的断崖群，崖下云海翻涌，圣光矿脉嵌在崖壁里，也就是云海断崖矿脉
          峰间山道: 联络群峰的主干山道，石阶、吊桥与驿站沿峰脊相接，直通主峰圣都
          孤山: 偏离群峰主列的独立山体，如眠云岭，云岚绕顶，罕有人迹
          垭口与鞍部: 峰与峰之间的低凹处，风疾雾重，是穿行群峰的捷径，山泉多自此渗出
          古代遗构: 群峰岩壁间散布着封死的石门与过分规整的石阶，疑是古翼民留下的，翼民绕行而不叩
        气候:
          类型: 高山山地气候，随海拔垂直分带
          温度: 峰腰温凉，云海带寒湿，近主峰处趋近高寒
          风与降水: 断崖处风急，垭口云岚浓重，冬季积雪封道
          特征: 云海线上下是两重天，线上晴光线下雾，一日之内可历数季
      生态:
        植被: |
          峰腰为高寒针叶林与苔藓矮灌，断崖岩隙里生着石生草
          云海带以下蕨类与山花丛生，聚落四周广种耐寒果木
        动物: 岩羊、高山狐与貂，猛禽栖于断崖；矿道深处偶有蝠群；驮畜沿山道往来
      资源:
        云海断崖矿脉: 圣光矿的产地，出产圣光矿石，供水岚区工坊熔炼与圣具锻造，是群峰最主要的物产
        林产: 高寒针叶林出产建材与薪材
        山泉: 崖间泉眼众多，汇流供聚落与驿道取用
        探索: 群峰遗迹与矿脉深处偶见传说品质的材料与物品
      主要节点:
        光砾坪: 半山向阳的崖坪，圣光矿采掘聚落，矿道直入云海断崖矿脉，深部凿至封脉壁
        眠云岭: 群山深处的孤山，封存异界遗骸、禁忌圣具与蚀界污染样本，是圣眠所体系在群山的延伸
        曙峰: 教义部、白羽谱库与白羽裁庭所在，教义与谱牒的公共中枢
        霜崖: 圣仪院圣具锻造工坊所在，圣具冷淬与终验之地
        风切崖: 圣翼骑士团空战训练场所在，分翼机动战法的演武之地
        炽岭: 圣职卫队屯驻之地，地火热泉的守御之所
        月岭: 翼民公共的功勋纪念地，功勋碑林与传令牧场所在
