  贵族家族（梵尼亚）:
    说明: 十二家的先祖功业横跨两次位面战争——两战都关乎位面的存亡：第一次战争中，翼民与精灵共铸圣律天穹，扭转了败局；第二次战争中，天穹以自毁封印了主通道，翼民的存亡悬于一线。战后，教廷以圣羽加冕礼编定十三席，受封的人行垂羽效忠礼，名位记于白羽谱库。各家以家臣、祖业与职守相承，子弟多入圣职、军职与工坊。圣座是教廷的职位，不属于任何家族；十三席中有一家后来因背教除名，名讳被抹去，垂天白塔林西角只余一座废塔，现存十二家。各家的"活动地"是世代任职之所——机构与山峰都属于教廷，家族凭门第惯例掌职，并不占有那些地方
    圣座世家:
      辉翎家族:
        先祖: 第一次位面战争东线崩溃之际，在峰顶收拢败军、遗民与圣职者，立起战时共同体，奠定了圣都的基业
        常见任职: 教义部、白羽谱库与白羽裁庭
        家训: 长夜之后，吾为黎明
        徽记: 金羽绕日
        活动地: 曙峰，设教义部庄园与抄经坊
        家臣: 守卷家，世代侍奉辉翎，掌主家的仪礼与谱库日常，对谱系条目的熟悉程度甚至超过主家
        立场: 传统派
      银霜家族:
        先祖: 第一次位面战争末期，与精灵匠师共同铸成圣律天穹的核心圣纹，并主持终验，使天穹得以启用，扭转了战局
        常见任职: 圣仪院高阶圣仪官、圣具匠
        家训: 唯经考验者长存
        徽记: 银羽凝霜
        活动地: 霜崖，设圣具锻造坊
        家臣: 拂尘家，世代侍奉银霜，掌净化仪礼与工坊杂务
        立场: 维新派
    骑士世家:
      裂空家族:
        先祖: 第二次位面战争初期，创分翼机动战法重整翼军；在断空战役中以分翼奇袭围歼异界先锋空骑，夺回主战区的制空权，为联军赢得了战争初期的喘息之机
        常见任职: 圣翼骑士团将领、教官
        家训: 吾即雷霆
        徽记: 雷羽裂云
        活动地: 风切崖，设空战训练场与风舍
        家臣: 栖风家，世代侍奉裂空，掌风舍与战前备羽，子弟世代为裂空家翼骑士扈从
        立场: 传统派
      炽翎家族:
        先祖: 第二次位面战争的封印行动中，率残部封锁核心圣域入口，直到天穹封印闭合，以全员殉身的代价换来了封印的完成与主力的撤离
        常见任职: 圣职卫队军官
        家训: 烈火不退
        徽记: 赤羽擎火
        活动地: 炽岭，圣职卫队屯驻之地
        立场: 传统派
      长歌家族:
        先祖: 第二次位面战争各军失联之际，重建了横跨大陆的高空侦察传令网，并成功锁定异位面主通道的特征，为后续行动奠定基础
        常见任职: 圣翼功勋院、骑士团传令体系
        家训: 风暴所忘，吾等铭记
        徽记: 白羽踏月
        活动地: 月岭，设牧场与功勋碑林
        家臣: 拾光家，世代侍奉长歌，掌战歌记录与功勋誊写，家史与主家的战绩录在同一卷里
        立场: 同情改革派
    匠师与文职世家:
      锻羽家族:
        先祖: 第一次位面战争中，主导圣律天穹承力构件与圣纹军备的铸造，为翼军精锐圣翼骑士团配备了圣光武装
        职能: 按圣仪院模板承造礼器与圣具胚件
        常见任职: 水岚区熔炉群匠师、受征调的圣仪工坊匠师
        家训: 吾翼铸于铁砧
        徽记: 砧上生羽
        居所: 水岚区熔炉群
        立场: 改革派
      沐翎家族:
        先祖: 第一次位面战争中开创圣光涤愈之术，后来在圣都创立了治愈院
        常见任职: 治愈院、圣女圣殿
        家训: 凡伤皆吾伤
        徽记: 白羽抚水
        居所: 云钟区
        立场: 维新派
      启翎家族:
        先祖: <绝密>两次位面战争之间创立初光礼，把圣纹嵌入体内，令翼民可以凭意念调用圣纹</绝密>
        常见任职: 授种派仪礼官
        家训: 毋使一羽，忘其初晨
        徽记: 晨羽引光
        居所: 霄霞区
        立场: 中立
      纪翎家族:
        先祖: 第一次位面战争初期，奉命往返于精灵之间斡旋，促成两族缔结盟约，圣律天穹才得以共铸
        常见任职: 白穹书馆、圣务局文书体系
        家训: 天穹书于吾誓
        徽记: 羽笔卷云
        居所: 云钟区
        立场: 传统派
      静翎家族:
        先祖: 第一次位面战争结束后，奉密令封存战争遗留的异界遗骸与禁忌圣具，创立了圣眠所与归寂礼法
        常见任职: 圣眠所、归寂派
        家训: 所葬者，吾永携之
        徽记: 垂羽入夜
        居所: 霄霞区静室
        立场: 中立
      笃羽家族:
        先祖: 第二次位面战争结束后，汇编散佚的战技、仪礼与圣职之学，创立学堂以传承
        常见任职: 学堂院教师、训导者
        家训: 学识不循血脉
        徽记: 双羽持卷
        居所: 云钟区
        立场: 传统派
      衡翎家族:
        先祖: 第一次位面战争后，主持圣都的圣职清查，创立圣选署与候补递补礼制，使折损后的军职、教务与仪礼得以延续
        常见任职: 圣选署
        家训: 一羽自有其重
        徽记: 天平与羽
        居所: 浮岛缘台
        立场: 中立
