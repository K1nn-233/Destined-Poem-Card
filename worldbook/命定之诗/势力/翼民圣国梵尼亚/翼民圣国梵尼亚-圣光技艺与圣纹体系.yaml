  圣光技艺与圣纹体系（梵尼亚）:
    表·翼民所见:
      圣光: 辉煌女神的恩赐，一切真知的总体。翼民一生所修，是让自己的圣纹更接近圣光的秩序
      圣纹: 圣光落入个体的形态。千人千纹，随经历与道路成长；情绪激动或运用力量时显于体表，亮纹、收纹与展示都如展翼般自然
      圣光技艺: 诵出圣典中的章节，圣纹随之显露，依亮纹、构造、发动三步，在空中投影出半透明的圣光能量体。纹路的光一流转，力量随之激发。战技、疗愈与仪礼都照此进行，由教廷各院与师徒相承
      圣礼: 以言语与圣纹按礼序进行。初光礼、展翼礼、净羽礼、加冕礼、垂羽效忠礼等，都属此类
      圣纹与地位: 翼民相信，圣纹与圣光的契合程度决定一个人的上限，也与古翼民血脉有关；契合高的翼民自然居于上位
      教堂构装: 大圣殿与各教堂内壁的炼金构装，由圣光与圣纹构成，翼民视之为神圣。授种圣器（初光礼以血引光）、共鸣穹顶（大祈时放大光潮）、光导圣柱（引晨光落于祭坛）、圣纹祭坛（随仪轨明灭）、圣羽祭台（加冕时请出圣羽）、净化光井（汲取圣光炼净）、钟楼构装（依圣座时辰敲钟校时）
    里·遗产的真相:
      上古遗产: 古翼民依照一套圣纹接口规范制造的设备，由教会与世家层层保管。浮岛是其中的空域兵装，完好而休眠，见穹顶圣域
      接口规范: 上古技术的根基。规范的文本就是圣纹源典，分藏于教廷库藏，如今已有残缺，无人能读。圣纹模板是它的物化样本，封存于圣仪工坊
      圣纹与接口: 圣纹的图形、所诵的圣典章节与构造次序，共同构成接口。上古设备只认规范，不认身份
      适配: 圣纹形态与接口的契合因人而异。适配高的翼民能驱动更强的遗产，这样的人稀有，而且越来越少，与体内保留了多少古翼民血脉有关
      圣具: 圣纹固化于器物的造物，光路流转，可被圣纹激活。小的可持于手，大的散落圣都与群山之间，翼民奉为至宝；如今的人只知道怎么用，不知道其中的道理
      教堂构装: 翼民眼中的神圣构造，实为上古设备留在人间的操作口，供人取用圣光
      圣礼的真相: 这些圣礼本是维护与使用上古仪器的规程，一代代化入仪式，成了仪式知识
      保管与册封: 教会是上古遗产唯一的保管机构，以教义代行律法；外来的魔导技术一律登记，擅自引入被视作玷污，由审检局与白羽裁庭处置
      隐患: 圣纹可以被技术理解与改良。这一真相一旦公开，以血脉与遗产为根基的神权秩序便会动摇；传统派死守教条，因为教条里还存着最后的操作知识
