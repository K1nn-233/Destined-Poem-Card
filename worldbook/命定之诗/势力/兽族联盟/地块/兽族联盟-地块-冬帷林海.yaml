---
冬帷林海:
  概览: |
    联盟西北部的广袤山麓林海，西、北紧邻龙脊山脉北段，东接风泣雪原，南连天镜湖湿地
    受龙脊地热与沉眠龙姬的影响，林间温热湿润、蒸汽弥漫，季节温差极大，成片枯木林散布于地热裂谷
    是龙脊山脉与北方雪原之间的天然屏障与缓冲地，兽族多依林而居，狩猎、育兽与采集并存
  地理:
    类型: 火山山麓针叶林海
    主要地形:
      蒸云腹林(中部): 地热熏蒸的核心林区，蒸汽与雾霭终年不散，林木高密
      烬骨谷(西部): 逼近龙脊火山带的地裂与灰岩台地，烟尘弥漫、焦枯林成片
      龙眠余烬(北部): 朝曜日龙姬沉眠火山方向，地脉温热、魔力浓郁，异兽盘踞
      苔荫缓林(南部): 向天镜湖湿地过渡的湿润混交林，溪泉密布
    水系:
      温涌泉群: 林间地热泉与沸池成带，水色随矿质而异
      黑杉河: 自龙脊山脉贯穿冬帷林海南流入天镜湖湿地的大河，支脉无数
  气候:
    类型: Dfb—Cfa过渡，受地热调节
    温度: 冬季因林密与地热而不至酷寒；夏季闷热
    降水: 偏丰，林内湿度高，晨雾经久不散
    特征: 季节温差极大，一谷之内可兼见葱郁林地与焦枯林；地热蒸汽为草原奇景
  生态:
    植被: 针叶林为主，地热处多枯木与苔藓，谷地有湿热魔法材料
  资源:
    林产: 木材、树脂与沉积结晶
    地热: 药性矿泥、温泉水与地热魔法材料
    矿料: 火山带的矿料与火性晶石
  人文:
    氏族聚族而居，重体魄与传统，以林猎、育兽与采集为生
    视火山与龙姬沉眠处为圣地，依节候祭祀先祖，习俗朴野尚勇