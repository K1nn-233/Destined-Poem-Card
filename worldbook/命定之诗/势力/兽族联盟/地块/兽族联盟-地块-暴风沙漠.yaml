---
暴风沙漠:
  概览: |
    联盟中部的干旱砾漠与沙带，四周多被草原、谷原环抱，是联盟的地理与权力心脏
    终年狂风、沙暴频发，植被稀少，魔晶、魔矿富集
    巡天巨兽驻足于此，巡天王庭立于巨兽背上，是联盟的政治与贸易中枢
  地理:
    类型: 风蚀砾漠与沙丘带
    主要地形:
      啸风沙原(全域): 风蚀砾漠与移动沙丘，沙暴常见，岩丘间魔晶、魔矿丰富
      沉沙砾谷(南部): 干涸盆地与砾石走廊
      巨兽背庭(核心): 巡天巨兽驻足之地，王庭居其上
    水系:
      匿泉: 稀少的绿洲泉与地下水脉，聚落皆环泉而建
      巨兽: 巨兽背部自然生成水源
  气候:
    类型: BWk+巨兽影响
    温度: 昼夜温差悬殊，夏酷热、冬严寒
    降水: 由巨兽喷发至全域，每五天一场雨
    特征: 终年风沙，风暴与沙丘迁移不断改变地貌
  生态:
    植被: 砾漠耐旱灌丛与风生沙草
  资源:
    矿料: 魔晶与魔矿极为丰富
    工造: 采矿、炼金与运输业发达
    商贸: 王庭所在，四方部族汇聚互市
  人文:
    因干旱而聚于泉眼与绿洲，善驮运、辨向与炼晶
    巡天巨兽背上的王庭为联盟政治与贸易中心，各国大使云集于此
    尚武而重利，风气豪烈，契约与誓约极受看重
  主要节点: 巡天王庭