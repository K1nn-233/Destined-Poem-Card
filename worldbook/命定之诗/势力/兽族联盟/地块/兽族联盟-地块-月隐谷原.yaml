---
月隐谷原:
  概览: |
    联盟东南部的狭长谷原，南北两列山脉夹峙，中间为开阔草谷，东西贯通为天然走廊
    气候偏干、日照充足，山脉矿物富集，南向山脉阻隔无尽树海
    以谷中月色常被山影掩映
  地理:
    类型: 山脉夹峙的半干旱谷原
    主要地形:
      月晦走廊(中部): 谷原主体，草甸与旱生灌丛，东西通途
      北岭矿脉(北缘): 山体矿物富集带，矿脉与崖壁连绵
      南屏峡口(南缘): 通往无尽树海方向的山脉隘口与峡谷
      隐坡牧野(西段): 谷口缓坡，牧营与哨点交错
    水系:
      隐川: 谷底季节河，旱季断流、雨季成流
  气候:
    类型: BSk 冷半干旱
    温度: 昼夜温差大，夏热冬寒
    降水: 偏少，受山脉屏蔽，雨影效应显著
    特征: 日照充足，风干物燥，谷地时有尘扬
  生态:
    植被: 耐旱草灌与山麓疏林
    陆地生物: 岩栖猛兽与善奔的异兽
  资源:
    矿料: 山脉蕴藏丰富的矿料与珍石
    牧养: 耐旱力强的奔行之兽与坐骑
    药植: 旱生灵草与药性灌丛
  人文:
    以游猎与牧养为业，善于奔袭与骑射，部族多沿谷道设营
    谷道为草原东西商旅的通路，部族间以血誓盟约结盟互市
    崇尚迅捷、荣辱与信义，风气剽悍
