---
天镜湖湿地:
  概览: |
    联盟西南部的低平水乡，由一片广袤大湖与密布的河网、漫滩共同构成
    西承龙脊山脉余脉，东入风语草原，南隔丘陵遥望精灵王庭西北
    湖面开阔如镜，支流漫溢成大片湖沼与苇荡，水汽终年不散，是兽族草原水草最丰、聚落最密之地
    蝾螈王朝世居于此近六千年，以水泽为家，耕渔并重，为联盟重要的粮渔之乡与贸易门户
  地理:
    类型: 湖泊—河网冲积低地水乡
    主要地形:
      心湖岛(中部): 湿地主体湖面与湖心岛屿群，水浅流缓，岛屿之间以栈桥、石堤相连
      青萝河网(西部): 承接龙脊余脉融水的密集河汊，河道迂回、沙洲浅滩交错，晨昏多雾
      芦语漫滩(东部): 朝风语草原方向铺展的浅水苇滩与季节性沼泽，为水禽繁育之地
      岚泽苇海(南部): 面向精灵王庭一侧的暖湿泥沼与芦苇海，地势最低、水草最盛
    水系:
      镜湖: 湿地中心大湖，活水汇注，四时水位稳定，可行舟
      澜佩川: 湿地的母亲河，西起山麓融水，蜿蜒横贯湖盆后东流入风语草原
  气候:
    类型: Cfa 湿润亚热带，湖泊调节显著
    温度: 冬季温润少霜；夏季湿热而不酷烈
    降水: 丰沛，全年分配较均，春秋多连阴雨与湖雾
    特征: 大湖蓄热调温，无严寒酷暑；晨昏湖面常见平流雾，昼夜温差小
  生态:
    植被: 苇丛、水草与浮生植物为主，岸畔多湿生林与园艺林地
    陆地生物: 涉禽、水栖猛禽、两栖异兽与穴居小兽繁盛
    水生生物: 湖川盛产鳞族与甲壳之属
  资源:
    渔牧: 淡水渔获与水生魔材，滩地牧养水栖驮兽
    农产: 围泽而成的谷根作物与湖田
    矿料: 河床沙洲偶见灵砂与魔矿，湖底泥膏可入药
    工造: 蝾螈王朝工艺世代传承，花样繁复，精工巧匠
  人文:
    居民循水而居、以船代步，聚落多依洲岛与水湾
    生计重渔猎、围泽与水生灵植培育
    蝾螈族为主，善水域术法与灵气之艺，守礼重长幼，风貌与草原诸部迥异
  主要节点: 龙渊京
