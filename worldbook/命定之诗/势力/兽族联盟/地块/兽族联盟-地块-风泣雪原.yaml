---
风泣雪原:
  概览: |
    联盟北部的森林苔原与冰蚀湖泊地带，南接冬帷林海与恒风草原北端，北临通往放逐之地的海峡
    气候湿冷严寒，冬季漫长，林湖交错，风声呜咽如泣
    天霜王国据守全境，为联盟的北方屏障
  地理:
    类型: 亚寒带森林苔原与冰蚀湖群
    主要地形:
      霜熊林野(中与西部): 针叶密林与山麓，王国都城所在
      冰蚀湖群(东部): 苔原与针叶疏林交错
      白狐川源(南部): 连接联盟腹地的稀木林地区，冰融雪泉密布
      极北荒原(北部): 冰川湖与沼泽成片，向北有去往放逐之地的渡轮
    水系:
      冻湖暗河: 冰蚀湖泊与地下水系，冬季封冻
      白狐川: 冰融雪泉与河流，夏季融雪
  气候:
    类型: Dfc 亚寒带大陆性，北缘趋ET
    温度: 冬季漫长严寒，夏季短促湿凉
    降水: 以降雪为主，湿度大，常有迷雾
    特征: 极光与永冻常见，风雪连月，湖面终年多冰
  生态:
    植被: 针叶林、苔原与冻原植丛
    陆地生物: 耐寒猛兽、雪原禽兽与冰湖鳞族
  资源:
    林猎: 毛皮、林产与冰湖渔获
    矿料: 地脉矿料与寒性晶石
    育兽: 耐寒坐骑与驮兽的育种
  人文:
    以狩猎、牧养与守边为业，居所依林避风御寒
    重坚韧、力量与荣誉决斗，尊先祖传承与誓约
    封地守望互援，王与部族以义务相系
  主要节点: 巨熊城
