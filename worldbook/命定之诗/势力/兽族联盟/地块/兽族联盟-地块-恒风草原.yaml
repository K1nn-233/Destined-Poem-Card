---
恒风草原:
  概览: |
    联盟正东部的辽阔草甸与缓丘，为联盟最大的牧区与珍稀材料产地
    西连风语草原，东北抵神迹群山，东邻奥古斯提姆帝国，是与帝国对峙的前线
    常年烈风自东向西贯穿全境，河溪成带、草浪不绝
    鼠族王国主导其中部与东北部，是联盟对外的军事与贸易支点
  地理:
    类型: 温带起伏草原与缓丘
    主要地形:
      长风腹地(中部): 草原主体，草甸连绵，聚落与牧营散布
      山麓牧野(东北): 倚神迹群山的高草台地，水草丰美
      界风荒原(东部): 面向帝国边境的干疏草地与哨戍带
      金芒缓坡(西南): 向风语草原过渡的缓丘草野
    水系:
      硕鼠江: 横贯草原的长河，两岸为最肥沃的牧地
  气候:
    类型: Dfb—Cfb过渡
    温度: 冬寒夏凉，昼夜温差大
    降水: 中等偏多，多集中于夏季
    特征: 常年强风，风蚀与风积地貌常见；冬有扬雪
  生态:
    植被: 高草草甸与疏灌，河谷多湿生草甸，鼠族王国常见人造林
  资源:
    农牧: 种植培育各种粮食、魔法作物，集约化群牧
    材料: 珍稀魔法材料植物与魔物材料丰富
    矿料: 缓丘与山麓的浅层矿脉
  人文:
    以畜牧、种植业为主，精于魔物与魔法作物育种，王国培育各行业匠师
    地处前线，边地聚落警备尚武，王国内商贸繁荣，文化开放
  主要节点: 风信子城|石蒜城