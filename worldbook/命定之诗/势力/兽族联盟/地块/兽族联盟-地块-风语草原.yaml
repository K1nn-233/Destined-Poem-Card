---
风语草原:
  概览: |
    联盟中部与南部的开阔草原，北接天镜湖湿地与暴风沙漠，东入恒风草原，南望无尽树海
    地势起伏和缓，河曲与湖沼点布，因风拂草浪如絮语而得名
    气候多变、草木丰茂，是联盟动植物种类最多、部族最杂的核心草场
  地理:
    类型: 温带开阔草原
    主要地形:
      风语海原(中部): 草原本体，风拂草浪层层，聚落散布
      南风沃野(南部): 靠近精灵王庭和无尽树海的湿润草甸与疏林
      河曲漫野(北部): 天镜湖与暴风沙漠之间的河湖草滩
      群兽闲庭(东部): 向恒风草原过渡的多族聚居带
    水系:
      风语川: 横贯草原的西东向河流，河曲发达、湖泊串布
  气候:
    类型: Cfa—Dfb过渡
    温度: 四季鲜明，年温差低
    降水: 适中，分配较均
    特征: 气候多变，偶发骤雨、冰暴与风向突变
  生态:
    植被: 高草草甸、河岸林与疏灌，种类繁多
    陆地生物: 陆地魔物与水生魔物俱全，取之不竭
  资源:
    农牧: 战兽、牧兽与杂交群牧，产出极为丰富
    采集: 各种动植物材料极为丰富
    狩猎: 渔猎活动极为常见，仍是聚落获取食物材料的常见手段
  人文:
    部族零散游牧，聚落依水草而迁徙，逐季转场
    多族杂处，通行盟约与互市，萨满依自然之灵行祭
    崇尚自由、荣誉与共御外敌，向心力随战事而聚
