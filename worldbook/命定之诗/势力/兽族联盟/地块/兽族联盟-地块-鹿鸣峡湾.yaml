---
鹿鸣峡湾:
  概览: |
    联盟东北部的低高原海岸地带，西、南倚山，东、北临海
    海岸曲折成峡湾，内陆为缓起低原，海洋调节下气候温润，针阔混交林繁茂
    以林间多鹿群长鸣
  地理:
    类型: 海洋性低高原与峡湾海岸
    主要地形:
      潮声峡岸(东部): 临海的深切峡湾与崖岸，多天然避风港湾
      雾林低原(中部): 缓丘低林与湿地草甸交错
      群鹿高地(西南): 倚山的开阔台地，草场与疏林相间
      寒礁外屿(北部): 近岸岛屿与礁群散布
    水系:
      比比喇泊: 位于东南边界的巨大湖泊
  气候:
    类型: Cfb 温带海洋性，北缘趋Cfc
    温度: 冬温夏凉，年温差小
    降水: 充沛而均匀，多雾多雨
    特征: 受海洋调节显著，海雾常见，冬季岸线不冻
  生态:
    植被: 针阔混交林、海岸灌丛与草甸
    陆地生物: 鹿群、林地猛兽与灵巧小兽
    海洋生物: 近海有海兽与海禽，渔场丰饶
  资源:
    林渔: 林产与近海渔获
    航贸: 天然良港，与放逐之地各聚落有商贸来往
    牧养: 台地牧养与毛皮之属
  人文:
    依林海与海岸而居，兼营渔猎、牧养与采集
    善海船与沿海互市，聚落多临港而建
    崇尚自然盟约与先祖之灵，民风沉稳务实
