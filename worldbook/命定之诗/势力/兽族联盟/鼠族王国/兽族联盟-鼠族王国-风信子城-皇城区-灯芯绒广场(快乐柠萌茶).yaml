---
  风信子城-皇城区-灯芯绒广场:
    概述: 剧院、画廊、图书馆等文化设施集中地
    环境:
      位置: 皇城区南部
      建筑: 剧院宏伟，画廊精致，图书馆庄重
      氛围: 文化氛围浓厚，贵族与学者交流艺术
    主要地点:
      郁金香大剧院: 演出歌剧、戏剧、音乐会，贵族娱乐场所
      皇家图书馆: 收藏大量典籍，包括历史、魔法、文学，展示绘画、雕塑等艺术作品，定期举办展览
    特色:
      高端艺术: 可观看顶尖戏剧表演或委托创作艺术品
      学术研究: 图书馆提供丰富的文献资料
    危险:
      艺术争议: 某些作品可能引发政治或宗教争议