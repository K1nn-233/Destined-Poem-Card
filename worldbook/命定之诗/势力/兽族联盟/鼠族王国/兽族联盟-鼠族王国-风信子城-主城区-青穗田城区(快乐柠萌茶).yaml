---
  风信子城-主城区-青穗田城区:
    概述: 城内种植产地与后勤供应基地
    环境:
      位置: 主城区西北角
      建筑: 农田、温室、磨坊与粮仓散布，另有畜牧围栏
      景观: 麦田与菜畦青翠，与城内石质建筑群形成鲜明对比
    主要地点:
      城内农田: 开垦的大片菜地与麦田，供应城市新鲜蔬果
      磨坊区: 风车与水轮磨坊加工谷物，生产面粉与饲料
      畜牧场: 圈养家畜家禽，提供肉蛋奶类产品
      协作市场: 城外部落牧民到此交易畜群与皮毛
    特色:
      城市菜篮: 保障风信子城日常粮食供应，减少对外依赖
      部落协作: 与恒风草原游牧部落建立稳定供销关系
      炼金种植: 温室中培育炼金术所需材料
    危险:
      病虫害: 密集种植易引发病虫害，需学术防治
      牲口瘟疫: 部落带入的疫病可能传染至城内畜群