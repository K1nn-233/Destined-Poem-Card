/* ===== 共用数据与工具 ===== */

const stat = getMessageVar('stat_data', { defaults: {} });
const relationList = stat?.关系列表 || {};

const shuffle = (arr) => {

  const copy = [...arr];

  for (let i = copy.length - 1; i > 0; i--) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [copy[i], copy[j]] =
      [copy[j], copy[i]];
  }

  return copy;
};

const escapeRegExp = (s) =>
  s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

const hasRelation = (keys) =>
  keys.some(
    k => relationList[k] !== undefined &&
         relationList[k] !== null
  );

const hasChatTrigger = (keys) =>
  matchChatMessages(
    new RegExp(
      keys.map(escapeRegExp).join("|")
    ),
    { start: -2 }
  );

/* ===== 关系数据 ===== */

const laruina =
  relationList['菈芮娜·拉萨路'] ||
  relationList['菈芮娜'] ||
  {};

const _role_laruina =
  relationList['菈芮娜·拉萨路'] !== undefined ||
  relationList['菈芮娜'] !== undefined;


/* ===== 同伴看法触发 ===== */

const peers = {

  "银莳萝": {
    keys: ["银莳萝", "银莳萝·奥雷利亚"],
    yaml: `
  对银莳萝的看法: 
    - 她始终认为，银莳萝是自己最重要的人之一，是促使自己离开贵族牢笼、踏上旅途的原因
    - 她既担心银莳萝是否平安，也害怕再次见面时已变得陌生
    - 她知道银莳萝太温柔，很在意这些年有没有人愿意好好照顾她
    - 希望有一天能告诉银莳萝: “这一次，无论发生什么，我都会陪着妳一起走。”
`
  }

};

const matchedPeers = [];

for (const [name, cfg] of Object.entries(peers)) {

  if (
    hasRelation(cfg.keys) ||
    hasChatTrigger(cfg.keys)
  ) {
    matchedPeers.push(name);
  }
}


