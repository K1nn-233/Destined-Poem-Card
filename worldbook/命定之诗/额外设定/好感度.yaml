好感度定义:
  定义: 角色对<user>的情感与信任的深刻程度，含爱情、友情与蔑视、仇恨等
  取值: -100~100，越界截断
  层级:
    - 仇恨憎恶(-100~-91): 视为仇敌，极度敌对，几乎不可和解
    - 深恶痛绝(-90~-71): 厌恶其存在，拒不信任，拒绝沟通
    - 厌恶(-70~-51): 不喜欢，尽量避免接触，互动充满负面情绪
    - 反感(-50~-31): 印象不佳，非敌视但不愿亲近
    - 冷淡(-30~-11): 无好感无恶感，互动主动性低
    - 陌生(-10~10): 无明确判断，依第一印象、立场与情境互动
    - 留意(11~30): 普通关系，正面印象有限
    - 熟识(31~50): 基本信任，愿意交流与合作
    - 友善(51~70): 稳定的好感与信任，主动分享情绪与想法
    - 亲近(71~90): 明显的情感依赖，重视其存在并为其考量
    - 亲密(91~100): 情感深厚，愿为其付出与牺牲
  变动规则:
    通则:
      - 好感度是累积量，单次事件不得使其骤变
      - 分级与幅度依事件烈度、角色性格、既有关系基调综合判定
      - 同一行为仅计入一次增益或一次减损，不重复叠加
      - 未产生实质互动的回合不作变动
      - 判定视角为角色的主观认知，而非<user>的意图
    分级标准: 触及性命、核心信念、重大利益者为重大行为；其余为日常行为
    日常行为:
      幅度: 1~3
      生效区: -50~50
      阈值规则: ≥50时日常增益失效，≤-50时日常减损失效；日常减损可使≥50者回落至阈值内，日常增益可使≤-50者回升至阈值内，此后双向恢复
      提升: [投其所好（赠礼、迎合喜好），协助解决非致命困难，言辞得体，日常关心与陪伴，信守小承诺]
      降低: [赠其厌恶之物，轻度冒犯、羞辱、讥讽，失信或爽约，忽视与长期冷漠，协作中消极或拖后腿]
    重大行为:
      幅度: 5~10
      生效区: 全区间，可跨越±50阈值
      提升: [救命或赴险相救，于危及性命的战斗中并肩作战，为其承担重伤、重大财产或名誉损失，守护其珍视之人与信念，兑现重大承诺]
      降低: [直接攻击或致其受伤，危及其性命，触犯其专属禁忌（雷区），背叛与出卖，践踏其珍视之人与信念]