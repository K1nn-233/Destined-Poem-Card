---
# 魔导产业
人类国家:
  概述: |
    由锻造协会、炼金公会、魔法协会、伯伦斯法环四方共建的新兴产业，将锻造、炼金与魔法整合为可量产、可维护的魔导体系，始于复兴纪元180年左右
  四方共治: |
    设"魔导技术统合院"统一标准和技术，但四方可各自认证、制造与管控
翼民与高精灵: |
  两族的魔导技术远早于人类数千年，著名奇观·圣律天穹是复兴纪元前1350年两族的杰作
核心产品体系:
  产品分级:
    标准: 魔导照明、家用器具、通讯法器、魔导工具
    进阶: 魔导武装、民用载具
    高端: 战略魔导炮、大型城防阵列、空间装备
    奇点: 圣律天穹
魔导载具: 
  耗能: 
    基础运行: 通常内嵌可充能式储能魔晶或吸收周围魔力供能，运行耗能可忽略不计，魔晶单次充能可运行数天
    其他功能: 需使用者额外MP充能或自行恢复，MP消耗量可参考技能消耗
魔导器类型示例: 
    增幅器: 数值对应[技能威力]，战斗时替换[普攻]的伤害，使用者MP消耗参考技能
    发射器: 通过消耗弹药攻击，使用[资源]数值，代入额外伤害，使用者MP消耗极低
制造: 主属性为力量或智力，锻造和炼金技能都可加成生产