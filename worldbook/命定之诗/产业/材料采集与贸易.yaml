# 材料采集与贸易
概述: |
  制造业上游产业，涵盖农牧种植、矿产开采到高危区域素材采集的全链路。各类原材料经多级贸易网络汇聚，供应锻造、炼金、裁缝等下游产业
采集体系:
  农牧种植: |
    基础作物、经济作物与魔法作物的人工培育，以及魔物畜牧养殖。由各地庄园、农场及专业化魔法种植园负责，提供大宗基础原料
  矿产开采: |
    石材、矿物、魔晶、魔法金属、晶体、宝石等资源的开采与冶炼。由各地矿区运营
  高危采集: |
    深入未开发区域的野生采集活动，包括猎杀高层级魔物获取躯体和魔核素材、采集野生魔法植物、发掘奇特矿石与古代遗物。多为冒险者或专业采集队承担，风险与回报成正比
贸易流通:
  商会: |
    金狮商会大陆最大的跨势力物流网络，掌握主干运输与定价话语权。此外各地存在大量地区性商会、城市商团与集市网络，构成层级丰富的流通体系
  运输方式: |
    大宗常规物资依托商队、船队与原始列车。高价值或时效性强的材料多由空间装备或浮空艇运输，需额外安保
计量与单位:
  单位: 通常以用途为标准，如1[份]用于制作成品的材料，通常包含2[个]材料