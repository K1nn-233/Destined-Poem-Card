# 服装与奢侈品产业
概述: |
  集日用制造、身份标识与魔法工艺于一体的多元产业。产品不仅是遮体之物，更是社会地位、个人实力与审美品位的具象化表达
  因东方大陆的丝质、弹性织物(类似尼龙和氨纶)倾销，丝袜、胸罩、弹性衣物等常见，大陆服饰风格繁复多元
底层平民市场: |
  以实用耐磨为首要诉求。多采用普通织物，由城镇织工坊或裁缝制作
中产与冒险者与教会市场: |
  美观、舒适与实战需求。面料涵盖魔法/弹性织物、皮革、丝绒，样式可经术式编制做到极为复杂华美，但附加附魔较为简易，常为防护、自洁、恒温或嵌入储物术式
贵族与富豪市场: |
  彰显身份和奢华为目的。由大师级裁缝、皇家御用设计师操刀，取材异界织物、魔丝织锦、鳞皮、附魔晶石等珍稀物料，经术式编制与附魔塑形而成。部分衣饰自帶温控幻彩、流光变色甚至空间折叠，追求极致视觉与复杂附魔效果