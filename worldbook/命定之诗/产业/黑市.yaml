# 黑市
概述: |
  黑市并非实体市场，而是由本地权贵灰色资产与中间人构成的隐秘交易网络，分为稳定运营的灰色产业与匿名的中间人交易两部分
灰色产业: |
  由本地权贵掌控的灰色资产，如赌场、妓院、暗巷酒馆及合法奴隶贸易的隐蔽部分。多处于王国法律边缘甚至完全合法，仅需保持低调，是非法组织的资金与情报根基
中间人交易: |
  黑市的核心业务，经手高危、污染、特殊材料及非法药剂等无法公开流通的货物与委托
中间人据点: |
  黑市多寄身于酒馆或暗巷据点，聚集众多中间人。中间人各有独立渠道与买家，只掌握信息，不囤积货物
交易流程:
  验货: 卖方携货上门，中间人先验明品相、成色与价值
  寻买家: 中间人依自身信息网匹配需求买家，牵线双方
  成交: 双方当面交易，中间人居中抽成
货物不入库: |
  交易完成前货物始终由卖方持有，不经中间人存储
匿名为常: |
  交易双方多互不相识，身份与来历由中间人保密，事后各不相认
经营范围:
  高危材料: 被污染、诅咒或蕴含魔力的特殊素材
  非法药剂: 毒药、禁药与违禁炼金制品
  禁忌知识: 黑魔法典籍与禁术抄本
  灰色委托: 需匿名处理的买卖、运输与销赃
中间人:
  构成: 退隐走私者、落魄贵族、前冒险者等以信息牟利者
  规矩: 以信誉立足，泄露客户或吞没货款者会被整个网络排斥，甚至遭暗影之手清算
