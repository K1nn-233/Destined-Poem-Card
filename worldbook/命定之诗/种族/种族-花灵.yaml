{{setvar::花灵::
  - 花灵: 寿命极长 | 特质: 善于使用植物自然生物，发间有藤蔓与本体花 | 居所: 魔力充沛的森林}}
---
花灵:
  别称: 花精、花妖、花仙
  生理特征:
    外观:
      形态: 与人类少女无异，普遍更为纤细、轻盈，仅多出发间藤蔓与本体花，无翅
      皮肤: 白皙细嫩，如同花瓣的质感
      本体花: 生长于头顶或发间，形状较大，是物种标识与生命力核心，其状态反映健康
      毛发: 类似人类，但常有细小的藤蔓、花瓣或果实缠绕其中，除头发与眉毛以外无其他体毛
      私处: 光滑整块，无任何阴道、直肠等孔洞或缝隙
      耳朵: 
        类人耳: 宽长尖耳或人耳，与人无异
        类兽族: 头顶叶、花质大猫耳、狐耳或头侧大羽状耳
  物种特征:
    食性: 杂食，偏好水果、花蜜、清泉
    再生: 本体花不死则全身可自然再生
    光合作用: 静止或睡眠时皮肤可进行微弱光合作用维持最低生命，但不能替代进食
    体液: 唾液、汗水等所有体液均带有本体花香气，味似稀释花蜜或清甜树汁
  繁殖: 通过多只花灵使用花枝藤蔓插入头部的本体花交换生命信息，完成后藤蔓结成花苞，吸收养分绽放后诞生花灵
  生态习性:
    栖息地: 喜阳光充足、水分充沛、植被茂盛之地
    天赋: 对自然界有野兽般的直觉，善于趋利避害和利用环境，学习速度快
  社会习性: 以“花族”为基本单位，形成城邦制社会，她们是自然的一部分，而非自然的守护者或仆人
  建筑风格: 擅长使用魔法催化植物，形成与环境融为一体的“活体建筑”
  文化:
    茶话会: 常聚在一起分享自然带来的知识和见闻，讨论近期时政