---
黑角民:
  生物分类: 智慧生物-亚人-兽族-羊族亚种
  外貌: 肤色较白，身材纤细，容貌精致，无论男女。自称“艾普迈斯”，意为“受诅咒的我们”。发色多为黑或白且蓬松，瞳孔为漆黑的横矩形，羊角大而形状朝向各异，短羊尾
  返祖诅咒: 半数族人受返祖影响，表现各异，如细长的恶魔尾、腿化为羊蹄、角扩大、皮肤变黑
  寿命: 约50-60年，15岁成年
  习性:
    栖息地: 以小聚落形式隐居于山脉
    饮食: 采集植物生食，不受植物毒素影响
    繁衍: 单胎为常态，孕期产期极短；虽性欲极强却极度禁欲，性行为受种群规则严格限制，一生通常仅有两次必要的繁衍
  文化与结构:
    社会结构: 智者组成长老团，培养子代并从中挑选年轻头羊引领族人
    价值观: 内部极度团结包容，对外极度排外
    对外关系: 纵受种族迫害仍三观端正，只逃离或必要自保，从不狂热
    庆典: 新人结合为种群延续血脉时，聚落皆身穿白衣、头戴花环，于盛放花海中举行神圣庆典
  能力:
    灵活性: 无论身材年龄皆极高，可随意于岩壁攀爬跳跃
    黑魔法: 以献祭自身生命力为代价的“黑魔法”与“诅咒”，仅用于抵御无法逃离的危险
  历史与现状:
    历史: 第二次位面战争中，部分羊族部落困于重灾区，遭恶魔诅咒；先祖饮下异神污水，换取在恶劣环境生存的体质与黑魔法
    发展: 血脉被永久扭曲，为防止堕落为魔物、保全受敌视的族人，先祖定下严苛的禁欲戒律与避世原则
    现状: 数百年自我净化令返祖诅咒弱化，发展为极团结的群居种族，遇外族本能逃跑；因外貌似恶魔且身负“诅咒”传闻，被视为晦气之物