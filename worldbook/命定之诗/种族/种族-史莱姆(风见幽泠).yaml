---
史莱姆:
  定义: 由高弹性魔力凝胶构成的原始魔力生物
  地位: 分布最广的基础生物之一，其变种是极端环境的标志
  本质: 游离魔力结合自然介质而生，通常无高等智慧，行为由本能驱动
  外貌:
    形态: 无固定形体，半透明或不透明凝胶质，可随意变形（人形、兽形等）
    颜色: 随环境与元素组成变化
    特征: 体内可见悬浮的未消化物质
  移动: 凝胶压缩弹跳，弹性与爆发力极强
  生理:
    生命基础: 全身均匀凝胶、无核心；靠内部魔力流动维持结构；以环境魔力与空气中的水分为生
    成长: 吸收魔力、分解物质、与同类融合均可增大体型，实力越强分解力越强
    繁衍: 分裂
    防御: 弹性防御，吸收并反弹物理打击，物抗高；大型个体可分裂为数个小个体；元素变体免疫同属性伤害
    弱点: 针对性元素抑制与结构破坏
    体型: 随生命层级增大，第三层级起可在上限内自由调整尺寸；一至四层级分别约 1、100、1万、100万 立方米
    进化: 低层级可通过增大体型或受特殊影响晋升
  特殊现象:
    史莱姆雨: 高魔力浓度区大量史莱姆如雨坠落，视为小型天灾
  变体:
    常见: 环境类（性质与颜色随环境）、元素类（趋近同种元素）、特殊类（发射尖刺、施法、反弹投射物等）
    罕见:
      粉史莱姆: 体型小、凝胶密度极高，高价值目标
      史莱姆王: 吸收大量魔力、物质或同类而成的巨型个体，可短距传送
    复合: 可同时具备多种变体特征
    命名: 参考泰拉瑞亚，由颜色与性质决定（蓝史莱姆、冰雪史莱姆、幻星史莱姆）
  唯一个体(第五层级):
    史莱姆之神: 最强个体，凝胶密度极高、体型极小；可藏入其他史莱姆体内寻求庇护，护卫被灭则迅速逃跑
