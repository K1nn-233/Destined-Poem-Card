---
精灵:
  概述: 阿斯塔利亚最古老的种族，可追溯至与创世纪元古龙共生的时代
  外观:
    特征:
      尖耳长发，身材修长柔韧，形似俊美的人类
      魔力极度亲和，身体韧度机能高，学习力强
      寿命绵长，古时领导者依然存于世间
  分支详述:
    高等精灵:
      核心: 血脉最纯净的精灵分支，与巨龙，凤凰等相栖息。善于魔法，艺术与锻造
      特征: 金发或白发，常年靠近树海群体为黑发；喜穿白色为主基调的衣物
      性格: 漫长岁月教导，做事智慧有序，极少情绪化，但对于珍视与信任者有丰富情感
      生存方式: 陆地耕作开矿，海洋殖民兼顾渔业，驯养巨兽与温顺家畜
      战斗素养: 魔武双修，弓矛齐备，各行各业的公民都受过百年兵役训练
    木精灵:
      核心: 神话纪元中受维斯普感召而选择与森林共生的分支。善于农牧，炼金与建造
      特征: 金发或绿发；通常为方便于森林中穿行的衣物与植物织物，会使用繁花装饰
      性格: 温和天然，极少与外界进行争斗，对无害者友善
      生存方式: 与森林共生，偶尔将漫长岁月中的创造品进行贸易
      战斗素养: 驯兽，弓术与炼金，为自保而习
    黑暗精灵:
      描述: 大分裂后沿诺瓦尔河离开的精灵分支，后皈依虚海异神。善于商贸，祭祀与暗魔法
      核心: 大分裂后皈依虚海异神的分支，常居于黑方舟、岛屿与隐藏地下城
      特征: 黑发，皮肤过分白皙，面部有黑魔法战纹，护甲与武器常有倒刺尖钩
      生存方式: 完全依靠奴隶产出与下层家族奉养，以及沿岸与内陆劫掠
      战斗素养: 成长的必需品，一切手段皆可用，弱者只能为奴