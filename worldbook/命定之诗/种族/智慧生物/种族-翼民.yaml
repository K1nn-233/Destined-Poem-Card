---
翼民:
  外貌特征:
    概述: 背后生有功能性的羽翼（翼展3-5米），耳后另有一对小小的头翅，用来表达情感，也用来感受魔力。人类形态，身材匀称，气质出尘，普遍实力强大
    毛色与瞳色: 羽翼、头翅与体毛的颜色几乎没有限制，偏向纯色与浅色系，偶有杂色。眼瞳偏向明亮的浅色系、金属色与宝石色，带着一种神圣感
  年龄与寿命:
    平均寿命: 约150-200年
    成年年龄: 20岁
    特点: 既有独特的文化沉淀，又与外界保持着一定的交流
  生活习惯与社会结构:
    栖息地: 绝大多数生活在神迹群山之巅的梵尼亚圣都
    交通方式: 飞行
    饮食: 偏好清淡，如谷物、水果和"光尘花"蜜酒
    社会制度: 神权政体，由教皇、圣女与圣翼议会统治
  文化与传统:
    核心: 视自己为神的子民，信仰虔诚
    称号: 翼民中身居高位的，名号是"天使"
    仪式: 从成年到婚配等重要场合都贯穿着"展翼仪式"，以此展示羽翼的圣洁。羽翼的保养是日常的核心
    对外态度: 大部分友好，但有一部分翼民鄙视其他种族
  圣纹力量体系:
    定义: 翼民独有的力量，被视作辉煌女神的恩赐，通过圣纹引导圣光，投影出半透明的构造来发动
    圣纹:
      定义: 翼民独有的体内神圣回路，在情绪激动或运用力量时显于体表；千人千纹，随经历与道路成长；亮纹、收纹与展示圣纹，如同展翼般自然
      基础图形: 线/环/羽/矛/泉——线为笔直的光路，环为闭合的回路，羽为层叠的翼形，矛为尖锋，泉为涌动的光点
      运用: 以体表的圣纹为源，依亮纹、构造、发动三步，在空中投影出半透明的圣光能量体；战技、疗愈与仪礼都照此进行，仪礼尤其如此，靠的是言语与圣纹
      示例发展路径:
        线-环系 - 圣坛守卫: 闭环与交叉的直线严密相扣；投影为覆盖周身的圣光盔甲，侧重耐力与防御
        环-泉系 - 仪式祭司: 圆环套叠着流动的泉点，体表呈波纹状；投影为持续扩散的力场，侧重引导与共鸣
        泉-环-羽系 - 枢机圣职: 复数圆环环绕泉心，并层叠羽翼；投影为六翼辉光法相，侧重施加神圣意志
    初光礼: 新生的翼民在圣都教堂受初光礼，由仪礼官引导、圣仪官施纹，获得最初的点状圣纹；此后圣纹随经历成长
    共鸣与地位: 圣纹的强度与成长存在个体差异；宽大的羽翼、纯白的羽色与显著的圣纹，常被视为神恩的征象
