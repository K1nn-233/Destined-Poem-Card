---
魔物:
  定义: 魔力丰沛环境下诞生的自然物种，天生拥有操纵魔力的能力。又称“自然魔物”或“魔兽”
  分布: 存在于所有生态系统(草原/天空/森林/山脉/海洋/冰原/火山等)
  智力:
    - 第三层级: 可通言语，拥有智慧
    - 第五层级: 获得复杂思维能力
  进化路线:
    阶段进化: 在达到第三、第五层级时可进化
    进化方向:
      亚人化:
        第三层级: 部分形态或特征向人类靠拢
        第五层级: 转化成类亚人形态
        技能追加: 
          亚人化(第三层级获得): 
            品质: 成长
            效果:
              技能效果提高20%
              允许学习人类技能与穿戴人类装备; 学习魔物技能; 禁止穿戴[魔宠]装备
      极致化:
        第三层级: 核心特征得到强化、特化或某些种族有特定进化分支形态
        第五层级: 核心特征极度增强或进化为种族最强形态，形态更强大奇异
        技能追加: 
          极致化(第三层级获得):
            品质: 成长
            效果: 
              技能效果提高25%，第五层级时进化为50%
              允许装备[魔宠]装备，学习人类神术; 禁止学习人类战技与魔法，穿戴不含[魔宠]标签的装备
  种族类别命名规则:
    - 基础格式: 常见普通魔物 {特征词} + {物种基础名}
    - 进阶格式: 强大、稀有或特征复合的魔物 {单或多个特征词} + {物种基础名}
    - 神话格式: 神话级以上的魔物 {前缀称号} + {单或多个特征词} + {物种基础名}
    - 补充: 允许直接使用各类奇幻作品中的魔兽种族名