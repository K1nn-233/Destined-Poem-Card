克摩什大陆:
  别名: 龙头大陆|巨龙大陆
  位置: 极西之处，海洋对面的独立海域
  规模: 独立大陆
  形状: 呈现海龙龙头的轮廓，龙吻朝向西北方向。被分为"上颚"、"下颚"和"核心"三个主要区域
  人口构成: 本土被奴役种族82% | 巨龙5% | 亚龙/魔兽13%
  定位: 巨龙的现世落脚点与连接泰坦世界的物理通道
  大陆生态: 灾难遗址与异种生物建筑的结合。大陆中央百里是伴随紫色电弧与黑岩浆的焦土。而在中央禁区之外，地表充满黑曜石晶体。外围巨龙盘踞的宫殿全由本土奴隶种族使用巨兽骨骼与岩石浇筑而成，呈现出生物质感与庞大体量
  生态与社会: 大陆中央百里范围是安博卡的生命禁区。百里之外来自泰坦位面的巨龙奴役本土原生种族开采矿物、筑造宫殿并供奉巨龙。巨龙们互相不会攻击且保持距离，形成了一个以安博卡为中心的同心圆生态系统
  环境气候: 终年能量风暴。大陆中心区域剧毒硫磺烟雾弥漫，伴随热辐射扭曲力场；外围区域则空气极度干热，弥漫着火山灰与琉璃粉末。靠近大洞的区域重力紊乱，并伴随能量辐射
  巨龙财富: 奴役劳作、高阶晶体开采、地底泰坦世界的宝藏、巨龙前往阿斯塔利亚大陆的暴力掠夺
  主要地区:
    绝望之巢: 位于大陆中央的"核心"区域，安博卡的沉睡之地与王座
    巨龙之井: 大陆东南侧链接"下颚"地区的区域，连接地底泰坦世界的出入口，巨龙一族借此来到阿斯塔利亚大陆
    风暴天殿群: 位于"上颚"区域巨型宫殿群。由矿物与骨石筑成的巨龙寝宫，栖息着多数巨龙。每个天殿都由一个巨龙领主统治，领主之间维持微妙的平衡
    尖刺山: 大陆东北侧海拔最高的山群，是巨龙们往阿斯塔利亚大陆的主要起飞点
    黑滩: 大陆外围"吻部"的狭长浅滩，是巨龙们的狩猎场和奴隶种族的劳作场所
    巨虫之地: 位于大陆西侧的荒芜平原，生存着原先在大陆东侧生活的本土种族，他们被巨龙驱赶到了西侧的边缘荒芜地带，是弱势种族的最后避难所，同时这里是各类巨虫魔物的地盘
  文化与活动:
    社会氛围: 巨龙的压迫，以及对自身血统和天空的傲慢
    活动:
      风暴火焰舞会: 每隔数月，巨龙们集体在空中翱翔，在岩浆中舞动，展示力量与优雅的结合，以此来求偶与炫耀地位
      龙眠祭: 每数百年巨龙们会进行一次集体的龙眠，届时大陆会陷入短暂的宁静
      月日迁徙: 少数巨龙会向阿斯塔利亚大陆飞去，并在龙脊山脉或更远的区域筑巢或掠夺
  资源:
    采集:
      辐射魔晶
      上品魔力矿石
  历史: 
    远古时代: 克摩什大陆曾是一个繁荣的大陆
    安博卡的到来: 安博卡的到来摧毁了这片大陆并成为了统治者
    战斗与位面: 安博卡与另一位第六层级的强者发生了战斗并胜利，战斗中安博卡的吐息贯穿地表造就了连接地底泰坦世界的通道，之后安博卡进行了长时间的沉睡
    巨龙时期: 巨龙们首次登上了克摩什大陆，并逐渐融入地表的世界
  最高生命层级: 6(灾厄之翼·安博卡)/5(巨龙领主/其他巨型泰坦)